          h('button', { class: 'link', type: 'button', onclick: () => openBackupSheet() }, 'ファイルで引き継ぐ'))]);
      return;
    }
    // signed in
    const u = Cloud.user, name = u.displayName || u.email || 'ログイン中';
    const s = Sync.state === 'syncing' ? '同期しています…' : Sync.state === 'error' ? Sync.error : Sync.lastSync ? `同期済み（${fmtClock(Sync.lastSync)}）` : '同期の準備中…';
    box.append(
      h('div', { style: { display: 'flex', gap: '12px', alignItems: 'center' } },
        h('span', { class: 'avatar', style: { '--c': 'var(--accent)' } }, (name || '?').slice(0, 1).toUpperCase()),
        h('div', { class: 'grow', style: { minWidth: 0 } },
          h('div', { style: { fontWeight: 700, overflowWrap: 'anywhere' }, text: name }),
          h('div', { class: 'hint', text: `${Cloud.providerName()}でログイン中${u.email && u.displayName ? '・' + u.email : ''}` }))),
      h('p', { class: 'hint', role: 'status', style: Sync.state === 'error' ? { color: 'var(--warn)' } : {}, text: s }),
      h('div', { class: 'switch-row' }, h('div', { class: 'grow' }, h('label', { for: 'set-cloudkey', style: { fontWeight: 700 }, text: 'APIキーも同期する' }),
        h('p', { class: 'hint', text: 'オフにすると、Gemini APIキーはこの端末にだけ保存されます（ほかの端末では入力が必要です）。' })),
        switchCtl('set-cloudkey', Settings.get('cloudKey'), v => Settings.set({ cloudKey: v }), 'APIキーも同期する')),
      h('div', { class: 'switch-row' }, h('div', { class: 'grow' }, h('label', { for: 'set-cloudhist', style: { fontWeight: 700 }, text: '会話の履歴も同期する（文字のみ）' }),
        h('p', { class: 'hint', text: '発言の文字と話者がほかの端末でも見られます。録音はこの端末に残り、ほかの端末では再生できません。' })),
        switchCtl('set-cloudhist', Settings.get('cloudHistory'), v => Settings.set({ cloudHistory: v }), '会話の履歴も同期する')),
      h('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px' } },
        h('button', { class: 'btn ghost', type: 'button', onclick: async () => { await Sync.flush(); toast('同期しました'); } }, icon('refresh'), '今すぐ同期'),
        h('button', { class: 'btn ghost', type: 'button', onclick: () => openOtherDevice() }, icon('qr'), 'ほかの端末で開く')),
      h('button', { class: 'btn ghost block', type: 'button', onclick: async () => { await Cloud.signOut(); toast('ログアウトしました。この端末のデータはそのまま残ります'); } }, icon('logout'), 'ログアウト'),
      h('div', { class: 'notice-acts' },
        h('button', { class: 'link', type: 'button', onclick: () => openBackupSheet() }, 'ファイルに書き出す'),
        h('button', { class: 'link', type: 'button', style: { color: 'var(--danger)' }, onclick: () => deleteCloudData() }, 'クラウドのデータを削除')));
  };
  render();
  const off1 = Cloud.on(() => { if (box.isConnected) render(); else off1(); });
  const off2 = Sync.on(() => { if (box.isConnected) render(); else off2(); });
  return box;
}

const GOOGLE_MARK = 'https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg';   // Google's own sign-in mark (FirebaseUI)

/**
 * The usual sign-in form (shared by 設定 and the first-run screen):
 *   [ Google でログイン ]  [ X でログイン ]  ── または ──  メールアドレス / パスワード / [ログイン]
 *   パスワードをお忘れの方 ・ アカウントをお持ちでない方は 新規登録
 */
function LoginForm({ onDone } = {}) {
  let mode = 'login';
  const box = h('div', { class: 'login' });
  const out = h('p', { class: 'login-msg', role: 'alert' });
  const say = (text, ok = false) => { out.textContent = text || ''; out.classList.toggle('ok', ok); };
  const fail = e => {
    if (e && (e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request')) return;
    say(Cloud.errorText(e));
  };
  const provider = method => async () => {
    say('');
    try { Cloud.error = ''; await Cloud.signIn(method); onDone && onDone(); } catch (e) { fail(e); }
  };
  const mark = h('img', { src: GOOGLE_MARK, alt: '', width: '20', height: '20', onerror: function () { this.remove(); } });
  const email = h('input', { class: 'input', id: 'login-email', name: 'email', type: 'email', autocomplete: 'username', inputmode: 'email', placeholder: 'name@example.com', required: true });
  const pass = h('input', { class: 'input', id: 'login-pass', name: 'password', type: 'password', autocomplete: 'current-password', required: true });
  const eye = h('button', { class: 'pass-eye', type: 'button', 'aria-pressed': 'false', 'aria-label': 'パスワードを表示', onclick: () => {
    const show = pass.type === 'password'; pass.type = show ? 'text' : 'password';
    eye.textContent = show ? '隠す' : '表示'; eye.setAttribute('aria-pressed', String(show)); eye.setAttribute('aria-label', show ? 'パスワードを隠す' : 'パスワードを表示');
  } }, '表示');
  const passLabel = h('label', { for: 'login-pass', text: 'パスワード' });
  const passHint = h('p', { class: 'hint', text: '6文字以上', hidden: true });
  const submit = h('button', { class: 'btn block', type: 'submit' }, 'ログイン');
  const forgot = h('button', { class: 'link', type: 'button', onclick: async () => {
    if (!email.value.trim()) { say('メールアドレスを入力してから押してください。'); email.focus(); return; }
    try { await Cloud.resetPassword(email.value.trim()); say('パスワードを設定し直すメールを送りました。メールのリンクから新しいパスワードを決めてください。', true); } catch (e) { fail(e); }
  } }, 'パスワードをお忘れの方');
  const altText = h('span'), altBtn = h('button', { class: 'link', type: 'button', onclick: () => setMode(mode === 'login' ? 'signup' : 'login') });
  const setMode = m => {
    mode = m; say('');
    submit.textContent = m === 'login' ? 'ログイン' : '登録してログイン';
    pass.autocomplete = m === 'login' ? 'current-password' : 'new-password';
    passHint.hidden = m === 'login'; forgot.hidden = m !== 'login';
    altText.textContent = m === 'login' ? 'アカウントをお持ちでない方は ' : 'アカウントをお持ちの方は ';
    altBtn.textContent = m === 'login' ? '新規登録' : 'ログイン';
    box.dataset.mode = m;
  };
  const form = h('form', { class: 'login-form', novalidate: true, onsubmit: async ev => {
    ev.preventDefault(); say('');
    const e = email.value.trim();
    if (!e) { say('メールアドレスを入力してください。'); email.focus(); return; }
    if (!pass.value) { say('パスワードを入力してください。'); pass.focus(); return; }
    submit.disabled = true;
    try {
      await Cloud.signIn('email', { email: e, password: pass.value, create: mode === 'signup' });
      toast(mode === 'signup' ? '登録してログインしました' : 'ログインしました'); onDone && onDone();
    } catch (err) { fail(err); }
    finally { submit.disabled = false; }
  } },
    h('div', { class: 'field' }, h('label', { for: 'login-email', text: 'メールアドレス' }), email),
    h('div', { class: 'field' }, passLabel, h('div', { class: 'pass-wrap' }, pass, eye), passHint),
    submit,
    h('div', { class: 'login-forgot' }, forgot));
  appendKids(box, [
    h('button', { class: 'sso google', type: 'button', onclick: provider('google') }, mark, h('span', { text: 'Google でログイン' })),
    h('button', { class: 'sso x', type: 'button', onclick: provider('x') }, h('span', { text: 'X でログイン' })),
    h('div', { class: 'or', role: 'separator' }, h('span', { text: 'または' })),
    form,
    out,
    h('p', { class: 'login-alt' }, altText, altBtn),
  ]);
  setMode('login');
  if (Cloud.error) say(Cloud.error);
  return box;
}

/** step-by-step Firebase setup, and the place to paste its settings */
function openCloudSetup() {
  const cur = CloudConfig.load();
  const ta = h('textarea', { class: 'input', id: 'cloud-config', rows: '6', spellcheck: 'false', autocomplete: 'off', placeholder: 'const firebaseConfig = {\n  apiKey: "…",\n  authDomain: "….firebaseapp.com",\n  projectId: "…",\n  …\n};', style: { fontFamily: 'var(--font-mono, monospace)', fontSize: '13px' } });
  if (cur) ta.value = JSON.stringify(cur, null, 2);

    body: h('div', { style: { display: 'grid', gap: '10px' } },
      h('p', { class: 'hint', text: 'Gemini との接続が始まった・切れた・つなぎ直した記録です（新しいものが下）。通信が途切れるときは、この内容をコピーして伝えてもらうと原因を調べられます。APIキーや会話の内容は含まれません。' }),

        [true, '録音はオンです（設定タブで変更できます）'],
      ];
      pad.append(this.steps(3), h('h2', { style: { margin: 0, fontFamily: 'var(--font-display)' }, text: '準備ができました' }),
        h('div', { class: 'list' }, items.map(([ok, t]) => h('div', { class: 'row' }, h('span', { style: { color: ok ? 'var(--ok)' : 'var(--warn)' } }, icon(ok ? 'check' : 'info')), h('div', { class: 'main' }, h('span', { text: t }))))),
        h('p', { class: 'hint', text: 'よく一緒に話す人は「話者」タブで登録できます。家族の端末に登録済みなら、QRコードで受け取れます。' }));
      this.foot.append(next('はじめる', () => { this.close(); Nav.go('live'); }));
    }
    this.scrollEl.scrollTop = 0;
  },
};

/* ============================================================
   main — boot
   ============================================================ */
(async function boot() {
  Settings.load();
  applyAppearance();
  await DB.open();
  await Speakers.load();
  await Dict.load();
  // a session left "live" by a closed tab: close it, or drop it if empty
  try {
    for (const s of await DB.all('sessions')) {
      if (!s.live) continue;
      const utts = await DB.byIndex('utterances', 'sessionId', s.id);
      if (!utts.length) { await DB.del('sessions', s.id); continue; }
      s.live = false; s.endedAt = Math.max(...utts.map(u => u.at + (u.dur || 0)));
      s.utteranceCount = utts.length; s.summary = summarize(utts.map(u => u.speaker));
      await DB.put('sessions', s);
    }
  } catch (e) { console.warn(e); }

  // sign-in and sync between devices (a link from another device may carry the settings)
  const fromLink = CloudConfig.fromHash();
  await Sync.boot();

  Nav.mount(); LiveView.mount(); HistoryView.mount(); DetailView.mount(); SpeakersView.mount(); DictView.mount(); SettingsView.mount();
  Nav.go('live');
  if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', applyAppearance);

  // the voice model first, then the turn-taking model (both use the same ONNX runtime)
  SpeakerAI.init().catch(e => console.warn(e)).finally(() => SegModel.init().catch(e => console.warn(e)).finally(() => NemoModel.init().catch(e => console.warn(e))));
  if (!Settings.get('onboarded')) Onboarding.open();
  if (!window.KY_PREVIEW) Cloud.init().then(() => { if (fromLink && Cloud.status === 'out') toast('アカウント連携の準備ができました。ログインしてください', 3200); });

  // listening only ends with the stop button: coming back to the app re-checks the mic and the connection,
  // and leaving the page just saves what there is (a session left open is closed on the next start)
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') Conversation.wake(); else if (Conversation.running) Conversation.saveSession(); });
  window.addEventListener('pageshow', () => Conversation.wake());
  window.addEventListener('pagehide', () => { if (Conversation.running) Conversation.saveSession(); });
  window.addEventListener('online', () => { if (Conversation.running && Conversation.tr && Conversation.tr.trouble) Conversation.reconnect(); });
  window.addEventListener('offline', () => { if (Conversation.running && Conversation.tr) Conversation.tr.dropStale('offline'); });
  // a new key or model while listening: switch over without stopping
  let reTimer = 0;
  Settings.on(p => {
    if (!Conversation.running || !['apiKey', 'liveModel', 'language', 'smart'].some(k => k in p)) return;
    const sess = Conversation.session;
    clearTimeout(reTimer); reTimer = setTimeout(() => { if (Conversation.session === sess) Conversation.reconnect(); }, 300);
  });

  // handle for automated checks
  window.addEventListener('pagehide', () => { Sync.flush().catch(() => { }); });
  window.__ky = { Cloud, Sync, Backup, Conversation, SpeakerAI, Speakers, Dict, DB, Settings, QR, SharePayload, Base45, Fbank, LiveView, Nav, saveEnrollment, crc32 };
  document.documentElement.dataset.ready = '1';
})();

</script>

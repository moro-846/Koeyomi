      input: [{ type: 'audio', mime_type: 'audio/wav', data: b64 }],
      generation_config: {
        transcription_config: {
          language_codes: lang === 'auto' ? [] : [lang],
          mode: { type: 'verbatim', diarization_mode: 'speaker', timestamp_granularities: ['word'] },
        },
      },
    });
    const key = Settings.get('apiKey');
    const url = (DEBUG.mockrest || REST_BASE) + '/v1beta/interactions';
    // the way of passing the key that worked last time goes first
    const ways = ['header', 'query', 'bearer'];
    const pref = Settings.get('restAuth');
    if (pref && ways.includes(pref)) ways.sort((a, b) => (a === pref ? -1 : b === pref ? 1 : 0));
    let lastErr = null;
    for (const way of ways) {
      const headers = { 'content-type': 'application/json' };
      let u = url;
      if (way === 'header') headers['x-goog-api-key'] = key;
      else if (way === 'query') u += '?key=' + encodeURIComponent(key);
      else headers.authorization = 'Bearer ' + key;
      let res;
      try { res = await fetch(u, { method: 'POST', headers, body }); }
      catch (e) { lastErr = e; continue; }
      if (res.status === 401 || res.status === 403) { lastErr = new Error('HTTP ' + res.status); continue; }
      if (res.status === 429) {
        const text = await res.text().catch(() => '');
        if (/per day|quota|exhaust|retry in/i.test(text)) { const q = Quota.hit429(text); throw new QuotaError(quotaMessage(q.blockedUntil)); }
        throw new QuotaError('Gemini への送信が混み合っています。少し時間をおいてから、もう一度お試しください。');
      }
      Quota.note(auto);
      if (!res.ok) throw new Error('HTTP ' + res.status + ' ' + (await res.text().catch(() => '')).slice(0, 200));
      if (pref !== way) Settings.set({ restAuth: way });
      return parseWords(await res.json());
    }
    throw lastErr || new Error('auth');
  },

  /**
   * Split one utterance into per-speaker utterances.
   * Returns null (keep as is), or an array of new utterance objects (≥1).
   */
  async refine(u, conv) {
    const pcm = concatF32(u.audio);
    if (pcm.length < SR * 1.2) return null;
    const words = (await this.diarize(pcm, { auto: true })).filter(w => w.text && isFinite(w.s) && isFinite(w.e));
    if (!words.length) return null;
    // runs of consecutive words by the same label
    let runs = [];
    for (const w of words) {
      const last = runs[runs.length - 1];
      if (last && last.spk === w.spk) { last.words.push(w); last.e = Math.max(last.e, w.e); }
      else runs.push({ spk: w.spk, s: w.s, e: w.e, words: [w] });
    }
    // fold tiny runs (a stray word) into the previous run
    runs = runs.reduce((acc, r) => {
      const prev = acc[acc.length - 1];
      const text = r.words.map(w => w.text).join('');
      if (prev && (r.e - r.s < 0.35 || text.length <= 1)) { prev.words.push(...r.words); prev.e = Math.max(prev.e, r.e); }
      else acc.push(r);
      return acc;
    }, []);
    const labels = [...new Set(runs.map(r => r.spk))];
    // who is each label? embed that label's own audio
    const who = {};
    for (const lab of labels) {
      const parts = runs.filter(r => r.spk === lab).map(r => pcm.subarray(Math.max(0, Math.floor((r.s - 0.05) * SR)), Math.min(pcm.length, Math.ceil((r.e + 0.05) * SR))));
      const audio = concatF32(parts);
      const emb = audio.length >= SR * 0.6 ? await SpeakerAI.embed(audio) : null;
      let sp;
      if (emb) {
        const m = SpeakerAI.match(emb);
        sp = m.speaker ? { type: m.speaker.isSelf ? 'self' : 'person', id: m.speaker.id, score: m.score } : conv.unknownSpeaker(emb, true, voicedOnly(audio).length / SR);
      } else sp = labels.length === 1 ? u.speaker : { type: 'unknown' };
      who[lab] = { sp, emb };
    }
    // merge neighbours that turned out to be the same person
    const merged = [];
    for (const r of runs) {
      const sp = who[r.spk].sp, prev = merged[merged.length - 1];
      if (prev && sameSpeaker(prev.sp, sp)) { prev.words.push(...r.words); prev.e = r.e; }
      else merged.push({ ...r, sp, emb: who[r.spk].emb });
    }
    if (merged.length < 2) {
      // one voice after all: keep the live text, but trust the better label
      if (merged.length === 1 && merged[0].sp && merged[0].sp.type !== 'pending' && !(merged[0].sp.type === 'unknown' && u.speaker.type !== 'unknown')) u.speaker = merged[0].sp;
      return null;
    }
    const smart = !!Settings.get('smart');
    return merged.map((r, i) => {
      const v = conv.makeUtt(u.at + Math.round(r.s * 1000));
      let text = r.words.reduce((t, w) => joinSegments(t, w.text), '');
      if (smart) text = dropFillers(text);
      v.text = text; v.speaker = r.sp; v.emb = r.emb; v.refined = true; v.state = 'done';
      const a = Math.max(0, Math.floor((i === 0 ? 0 : r.s - 0.05) * SR)), b = Math.min(pcm.length, Math.ceil((i === merged.length - 1 ? pcm.length / SR : r.e + 0.05) * SR));
      v.audio = [pcm.slice(a, b)]; v.samples = b - a; v.dur = Math.round((b - a) / SR * 1000);
      return v;
    }).filter(v => v.text.trim());
  },
};

function parseWords(json) {
  const words = [];
  const walk = o => {
    if (!o || typeof o !== 'object') return;
    if (Array.isArray(o)) { o.forEach(walk); return; }
    if (o.type === 'word_info' && typeof o.text === 'string') {
      words.push({ text: o.text, spk: o.speaker || 'spk_1', s: secs(o.start_offset ?? o.startOffset), e: secs(o.end_offset ?? o.endOffset) });
      return;
    }
    for (const k of Object.keys(o)) if (o[k] && typeof o[k] === 'object') walk(o[k]);
  };
  walk(json);
  return words.sort((a, b) => a.s - b.s);
}
function secs(v) { if (typeof v === 'number') return v; if (typeof v === 'string') return parseFloat(v); if (v && typeof v === 'object') return (+v.seconds || 0) + (+v.nanos || 0) / 1e9; return NaN; }
function dropFillers(t) {
  return t.replace(/(^|[、。,.\s])(?:え[ーっ〜]*と?|えっと|あ[ー〜]+|う[ー〜]+ん|ん[ー〜]+|その[ー〜]+|あの[ー〜]+|まあ[ー〜]*)[、,]?(?=\S)/g, '$1').trim() || t;
}
function blobToBase64(blob) {
  return new Promise((resolve, reject) => { const r = new FileReader(); r.onload = () => resolve(String(r.result).split(',')[1]); r.onerror = reject; r.readAsDataURL(blob); });
}

/* ---------- 通信が切れて文字にできなかった発言を、あとから文字にする（履歴から） ---------- */
const LOST_CHUNK_SEC = 240;    // one request ≈ 4 min of speech at 16 kHz
Refiner.lostRequests = function (utts) {
  const sec = utts.filter(u => u.lost && u.hasAudio).reduce((a, u) => a + (u.dur || 0) / 1000 + 0.6, 0);
  return sec ? Math.max(1, Math.ceil(sec / LOST_CHUNK_SEC)) : 0;
};
/** returns the utterances that got their text */
Refiner.transcribeLost = async function (utts, onProgress) {
  const items = [];
  for (const u of utts) {
    if (!u.lost || !u.hasAudio) continue;
    const a = await DB.get('audio', u.id); if (!a) continue;
    items.push({ u, pcm: await decodeWav(a.blob) });
  }
  // several utterances per request, with a pause between them; words are handed back by time
  const GAP = Math.round(SR * 0.6), chunks = [];
  let cur = null;
  for (const it of items) {
    if (!cur || cur.len + it.pcm.length > LOST_CHUNK_SEC * SR) { cur = { parts: [], len: 0 }; chunks.push(cur); }
    it.chunk = chunks.length - 1; it.start = cur.len / SR; it.end = (cur.len + it.pcm.length) / SR;
    cur.parts.push(it.pcm, new Float32Array(GAP)); cur.len += it.pcm.length + GAP;
  }
  const smart = !!Settings.get('smart'), done = [];
  for (let ci = 0; ci < chunks.length; ci++) {
    onProgress && onProgress(ci, chunks.length);
    const words = (await this.diarize(concatF32(chunks[ci].parts))).filter(w => w.text && isFinite(w.s));
    for (const it of items.filter(x => x.chunk === ci)) {
      const mine = words.filter(w => { const m = (w.s + (isFinite(w.e) ? w.e : w.s)) / 2; return m >= it.start - 0.3 && m < it.end + 0.3; });
      let text = mine.reduce((t, w) => joinSegments(t, w.text), '').trim();
      if (smart) text = dropFillers(text);
      if (!text) continue;                 // nothing recognisable: keep the note
      it.u.text = text; it.u.lost = false; done.push(it.u);
    }
  }
  onProgress && onProgress(chunks.length, chunks.length);
  return done;
};

/* ---------- 会話全体を Gemini の話者分離で整理する（履歴から） ---------- */
const REORG_CHUNK_SEC = 540;   // one request ≈ 9 min of speech at 8 kHz (≈9 MB); labels are linked across requests by voice
const REORG_RATE = 8000;
/** how many requests tidying up this conversation will take */
Refiner.estimateRequests = function (utts) {
  const sec = utts.filter(u => u.hasAudio).reduce((a, u) => a + (u.dur || 0) / 1000 + 0.4, 0);
  return Math.max(1, Math.ceil(sec / ((window.__tune && window.__tune.reorgChunk) || REORG_CHUNK_SEC)));
};
Refiner.reorganize = async function (session, utts, onProgress) {
  const items = [];
  for (const u of utts) {
    if (!u.hasAudio) continue;
    const a = await DB.get('audio', u.id); if (!a) continue;
    items.push({ u, pcm: await decodeWav(a.blob) });
  }
  if (items.length < 2) throw new Error('録音された発言が少ないため整理できません');
  // pack utterances into chunks with short gaps, remembering where each one sits
  const GAP = Math.round(SR * 0.4), chunks = [];
  let cur = null;
  for (const it of items) {
    if (!cur || cur.len + it.pcm.length > ((window.__tune && window.__tune.reorgChunk) || REORG_CHUNK_SEC) * SR) { cur = { parts: [], len: 0 }; chunks.push(cur); }
    it.chunk = chunks.length - 1; it.start = (cur.len) / SR; it.end = (cur.len + it.pcm.length) / SR;
    cur.parts.push(it.pcm, new Float32Array(GAP)); cur.len += it.pcm.length + GAP;
  }
  // 1) Gemini decides who speaks when, inside each chunk
  const labelAudio = {};             // "chunk:spk" → [pcm…]
  for (let ci = 0; ci < chunks.length; ci++) {
    onProgress && onProgress(ci, chunks.length);
    const words = await this.diarize(concatF32(chunks[ci].parts), { rate: REORG_RATE });
    for (const it of items.filter(x => x.chunk === ci)) {
      const dur = {};
      for (const w of words) {
        const ov = Math.min(w.e, it.end) - Math.max(w.s, it.start);
        if (ov > 0) dur[w.spk] = (dur[w.spk] || 0) + ov;
      }
      const top = Object.entries(dur).sort((a, b) => b[1] - a[1])[0];
      if (!top) continue;
      it.label = ci + ':' + top[0];
      (labelAudio[it.label] = labelAudio[it.label] || []).push(it.pcm);
    }
  }
  onProgress && onProgress(chunks.length, chunks.length);
  // 2) put a name on each Gemini speaker: registered voice, or one of the unknown groups
  const labels = Object.keys(labelAudio);
  const info = {};
  for (const lab of labels) {
    const audio = concatF32(labelAudio[lab]).subarray(0, SR * 30);
    const emb = await SpeakerAI.embed(audio);
    const m = emb ? SpeakerAI.match(emb) : { speaker: null };
    info[lab] = { emb, sp: m.speaker ? { type: m.speaker.isSelf ? 'self' : 'person', id: m.speaker.id, score: m.score } : null, chunk: lab.split(':')[0] };
  }
  // the person most often matched on-device inside a Gemini speaker is a strong hint too
  for (const lab of labels) {
    if (info[lab].sp) continue;
    const votes = {};
    for (const it of items.filter(x => x.label === lab)) if (it.u.speaker.type === 'self' || it.u.speaker.type === 'person') { const k = it.u.speaker.type + ':' + it.u.speaker.id; votes[k] = (votes[k] || 0) + 1; }
    const n = items.filter(x => x.label === lab).length;
    const top = Object.entries(votes).sort((a, b) => b[1] - a[1])[0];
    if (top && top[1] >= Math.max(2, n * 0.6)) { const [type, id] = top[0].split(':'); info[lab].sp = { type, id }; }
  }
  // unknown speakers: link across chunks by voice, never merging two speakers Gemini separated in one chunk
  const groups = [];
  for (const lab of labels) {
    const it = info[lab]; if (it.sp || !it.emb) continue;
    const T = SpeakerAI.thresholds(it.emb.engineId);
    let best = null, v = -Infinity;
    for (const g of groups) {
      if (g.chunks.has(it.chunk) || g.engineId !== it.emb.engineId) continue;
      const x = SpeakerAI.sim(it.emb.engineId, it.emb.vec, g.centroid);
      if (x > v) { v = x; best = g; }
    }
    if (best && v >= T.create - 0.1) { best.members.push(it.emb.vec); best.chunks.add(it.chunk); best.labels.push(lab); const c = meanVec(best.members); best.centroid = SpeakerAI.kindOf(best.engineId) === 'simple' ? c : l2norm(c); }
    else groups.push({ engineId: it.emb.engineId, members: [it.emb.vec], centroid: Float32Array.from(it.emb.vec), chunks: new Set([it.chunk]), labels: [lab] });
  }
  // number groups by first appearance
  const first = g => Math.min(...items.filter(x => g.labels.includes(x.label)).map(x => x.u.at));
  groups.sort((a, b) => first(a) - first(b)).forEach((g, i) => { g.n = i + 1; g.labels.forEach(l => { info[l].sp = { type: 'unknown', cluster: g.n }; }); });
  // 3) apply
  const changed = [];
  for (const it of items) {
    if (!it.label || !info[it.label].sp) continue;
    const sp = info[it.label].sp;
    if (sameSpeaker(sp, it.u.speaker)) continue;
    it.u.speaker = stripSpeaker(sp); changed.push(it.u);
  }
  session.clusters = groups.map(g => ({ n: g.n, engineId: g.engineId, centroid: g.centroid, members: g.members.slice(0, 24), count: g.members.length }));
  return { changed, speakers: labels.length, groups: groups.length };
};

/* ============================================================
   cloud — アカウント連携と端末間の同期
   Firebase Authentication（Google / X / メールアドレス）+ Cloud Firestore。
   Firebase のプロジェクトは使う人が自分で用意する（無料プラン）。設定は端末ごとに保存し、
   「ほかの端末で開く」のQR・リンクで受け渡す。
   同期するもの: 設定（APIキーは選べる）・登録した声・辞書・会話の履歴（選べる・文字のみ）
   ============================================================ */
const FB_VERSION = '12.11.0';
const FB_BASE = `https://www.gstatic.com/firebasejs/${FB_VERSION}/`;
const CLOUD_CFG_KEY = 'koeyomi.cloud.v1';
const SETTINGS_TS_KEY = 'koeyomi.settings.ts.v1';
/** settings that follow the account (everything else stays with the device: mic, test sources…) */
const SYNC_SETTINGS = ['fontSize', 'theme', 'record', 'apiKey', 'keyParam', 'language', 'smart', 'liveModel', 'speakerModel', 'modelUrl',
  'strictness', 'speakerSwitch', 'segOn', 'segEngine', 'refineOverlap', 'refineDailyMax', 'restAuth', 'micSensitivity', 'noiseSuppression', 'selfId', 'onboarded',
  'cloudKey', 'cloudHistory'];
const SYNC_STORES = ['speakers', 'dict', 'sessions'];
const PART_SIZE = 300;                       // utterances per history document (Firestore documents are at most 1 MB)

/* ---------- the Firebase project's web settings ---------- */
const CloudConfig = {
  FIELDS: ['apiKey', 'authDomain', 'projectId', 'storageBucket', 'messagingSenderId', 'appId'],
  /** accepts the snippet Firebase shows (const firebaseConfig = { apiKey: "…", … }) or JSON */
  parse(text) {
    if (!text) return null;
    const cfg = {};
    for (const f of this.FIELDS) {
      const m = String(text).match(new RegExp('["\']?' + f + '["\']?\\s*:\\s*["\']([^"\']+)["\']'));
      if (m) cfg[f] = m[1].trim();
    }
    return cfg.apiKey && cfg.authDomain && cfg.projectId && cfg.appId ? cfg : null;
  },
  load() {
    if (window.KY_FIREBASE && window.KY_FIREBASE.apiKey) return window.KY_FIREBASE;
    try { return JSON.parse(localStorage.getItem(CLOUD_CFG_KEY)) || null; } catch (e) { return null; }
  },
  save(cfg) { try { localStorage.setItem(CLOUD_CFG_KEY, JSON.stringify(cfg)); } catch (e) { } },
  clear() { try { localStorage.removeItem(CLOUD_CFG_KEY); } catch (e) { } },
  /** a link that opens こえよむ on another device with the same Firebase settings */
  link(cfg = this.load()) {
    const c = {}; for (const f of ['apiKey', 'authDomain', 'projectId', 'appId']) c[f] = cfg[f];
    const b = btoa(unescape(encodeURIComponent(JSON.stringify(c)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    return location.origin + location.pathname + '#cloud=' + b;
  },
  /** opened from such a link: take the settings and tidy the address */
  fromHash() {
    const m = (location.hash || '').match(/cloud=([A-Za-z0-9_-]+)/);
    if (!m) return null;
    try {
      const json = decodeURIComponent(escape(atob(m[1].replace(/-/g, '+').replace(/_/g, '/'))));
      const cfg = this.parse(json);
      if (cfg) this.save(cfg);
      history.replaceState(null, '', location.pathname + location.search);
      return cfg;
    } catch (e) { return null; }
  },
  get usableOrigin() { return /^https?:$/.test(location.protocol); },
};

/* ---------- sign-in ---------- */
const Cloud = {
  status: 'off',          // off | loading | out | in | error
  user: null, error: '', fb: null, app: null, auth: null, db: null,
  listeners: new Set(),
  on(fn) { this.listeners.add(fn); return () => this.listeners.delete(fn); },
  emit() { this.listeners.forEach(fn => { try { fn(this); } catch (e) { console.error(e); } }); },
  get configured() { return !!CloudConfig.load(); },

  async init() {
    const cfg = CloudConfig.load();
    if (!cfg) { this.status = 'off'; this.emit(); return; }
    if (this.app) return;
    this.status = 'loading'; this.emit();
    try {
      const [app, auth, fs] = await Promise.all(['firebase-app', 'firebase-auth', 'firebase-firestore'].map(n => import(FB_BASE + n + '.js')));
      this.fb = { ...app, ...auth, ...fs };
      this.app = app.initializeApp(cfg, 'koeyomi');
      this.auth = auth.getAuth(this.app);
      try { this.auth.languageCode = 'ja'; } catch (e) { }
      this.db = fs.getFirestore(this.app);
      auth.getRedirectResult(this.auth).catch(e => { this.error = this.errorText(e); this.emit(); });
      await new Promise(resolve => {
        let first = true;
        auth.onAuthStateChanged(this.auth, u => { this._onUser(u); if (first) { first = false; resolve(); } }, e => { this.error = this.errorText(e); this.emit(); resolve(); });
      });
    } catch (e) {
      console.warn('cloud init failed', e);
      this.status = 'error';
      this.error = /import|fetch|module|load/i.test(String(e && e.message)) ? 'ログインの部品を読み込めませんでした。インターネットにつながっているか確かめてください。' : this.errorText(e);
      this.app = null; this.emit();
    }
  },
  /** new settings were pasted: start over with them */
  async reset() {
    Sync.stop();
    if (this.app) { try { await this.fb.deleteApp(this.app); } catch (e) { } }
    this.app = this.auth = this.db = null; this.user = null; this.error = '';
    await this.init();
  },
  _onUser(u) {
    this.user = u || null;
    this.status = u ? 'in' : 'out';
    this.error = '';
    this.emit();
    if (u) Sync.start(u.uid); else Sync.stop();
  },
  providerName(u = this.user) {
    const p = u && u.providerData && u.providerData[0] && u.providerData[0].providerId;
    return { 'google.com': 'Google', 'twitter.com': 'X', password: 'メールアドレス' }[p] || p || '';
  },
  async signIn(method, { email, password, create } = {}) {
    if (!this.auth) throw new Error('まだ準備ができていません');
    const F = this.fb;
    if (method === 'email') {
      return create ? F.createUserWithEmailAndPassword(this.auth, email, password) : F.signInWithEmailAndPassword(this.auth, email, password);
    }
    const provider = method === 'google' ? new F.GoogleAuthProvider() : new F.TwitterAuthProvider();
    if (method === 'google') try { provider.setCustomParameters({ prompt: 'select_account' }); } catch (e) { }
    try { return await F.signInWithPopup(this.auth, provider); }
    catch (e) {
      // a blocked popup: go to the login page and come back
      if (e && (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment' && this.usableOrigin)) return F.signInWithRedirect(this.auth, provider);
      throw e;
    }
  },
  get usableOrigin() { return CloudConfig.usableOrigin; },
  resetPassword(email) { return this.fb.sendPasswordResetEmail(this.auth, email); },
  async signOut() { await Sync.flush(); return this.fb.signOut(this.auth); },
  errorText(e) {
    const code = (e && e.code) || '', msg = (e && e.message) || String(e);
    const T = {
      'auth/popup-closed-by-user': 'ログインの画面が閉じられました。',
      'auth/cancelled-popup-request': 'ログインの画面が閉じられました。',
      'auth/popup-blocked': 'ログインの画面を開けませんでした。ブラウザのポップアップを許可してください。',
      'auth/unauthorized-domain': 'このサイトのアドレスが Firebase に登録されていません。Firebase の Authentication → 設定 →「承認済みドメイン」に ' + location.hostname + ' を追加してください。',
      'auth/operation-not-allowed': 'このログイン方法が Firebase で有効になっていません。Firebase の Authentication →「ログイン方法」で有効にしてください。',
      'auth/operation-not-supported-in-this-environment': 'ファイルを直接開いた状態ではログインできません。https のサイトに置いて開いてください。',
      'auth/invalid-email': 'メールアドレスの形が正しくありません。',
      'auth/missing-password': 'パスワードを入力してください。',
      'auth/weak-password': 'パスワードは6文字以上にしてください。',
      'auth/email-already-in-use': 'このメールアドレスはすでに登録されています。「ログイン」を押してください。',
      'auth/invalid-credential': 'メールアドレスかパスワードが違います。',
      'auth/wrong-password': 'メールアドレスかパスワードが違います。',
      'auth/user-not-found': 'このメールアドレスは登録されていません。「新しく登録」を押してください。',

    const out = { app: 'koeyomi', kind: 'backup', v: 1, at: Date.now(), settings, speakers: [], dict: [], sessions: [] };
    for (const sp of await DB.all('speakers')) out.speakers.push(await cloudEncode(sp, 'json'));
    for (const e of await DB.all('dict')) out.dict.push(await cloudEncode(e, 'json'));
    if (history) for (const s of await DB.all('sessions')) {
      if (s.demo || s.live) continue;
      const utts = (await DB.byIndex('utterances', 'sessionId', s.id)).map(uttForCloud);
      out.sessions.push({ meta: await cloudEncode(sessionForCloud(s), 'json'), utts: await cloudEncode(utts, 'json') });

  async download(opts) {

    const patch = {}; for (const k of SYNC_SETTINGS) if (j.settings && k in j.settings && j.settings[k] !== null) patch[k] = j.settings[k];

    for (const e of j.dict || []) await DB.put('dict', cloudDecode(e));

    for (const [k] of Object.entries(co).sort((x, y) => y[1] - x[1])) { const [a, f] = k.split('|'); if (map[a] || taken.has(f)) continue; map[a] = f; taken.add(f); }
    return list.map(u => {
      const a = this.key(u.auto), f = this.key(u.speaker);
      const ok = a.startsWith('u') ? map[a] === f : a === f;
      return { ok, cat: this.category(u), dur: u.dur || 0, auto: a, final: f, mixed: !!u.mixedReport };
    });
  },
  /** bubbles of the same person right after one another (split for nothing) */
  overSplit(utts) {
    const l = utts.filter(u => u.text && !u.demo).sort((a, b) => a.at - b.at);
    let n = 0;
    for (let i = 1; i < l.length; i++) if (!l[i].overlap && !l[i - 1].overlap && l[i].at - (l[i - 1].at + (l[i - 1].dur || 0)) < 400 && this.key(l[i].speaker) === this.key(l[i - 1].speaker)) n++;
    return n;
  },
  summarize(sets) {
    const R = { sessions: sets.length, n: 0, ok: 0, dur: 0, okDur: 0, mixed: 0, overSplit: 0, cats: {}, confusion: {} };
    for (const { utts } of sets) {
      const J = this.judge(utts);
      R.overSplit += this.overSplit(utts);
      for (const j of J) {
        R.n++; R.dur += j.dur; if (j.ok) { R.ok++; R.okDur += j.dur; }
        if (j.mixed) R.mixed++;
        const c = R.cats[j.cat] = R.cats[j.cat] || { n: 0, ok: 0 }; c.n++; if (j.ok) c.ok++;
        if (!j.ok) { const k = j.auto + '→' + j.final; R.confusion[k] = (R.confusion[k] || 0) + 1; }
      }
    }
    R.acc = R.n ? R.ok / R.n : null; R.accDur = R.dur ? R.okDur / R.dur : null;
    return R;
  },
  pct(x) { return x == null ? '—' : Math.round(x * 100) + '%'; },
  async reviewed() {
    const out = [];
    for (const s of await DB.all('sessions')) if (s.reviewed && !s.demo) out.push({ s, utts: await DB.byIndex('utterances', 'sessionId', s.id) });
    return out;
  },
  /** what a file for analysis holds: every conversation marked 確認済み, any with corrections, this one and the latest few */
  async forExport(currentId) {
    const list = (await DB.all('sessions')).filter(s => !s.demo).sort((a, b) => b.startedAt - a.startedAt);
    const out = [];
    for (const s of list) {
      const utts = await DB.byIndex('utterances', 'sessionId', s.id);
      const corrected = utts.filter(u => u.text && ((u.auto && this.key(u.auto) !== this.key(u.speaker)) || u.mixedReport)).length;
      if (s.reviewed || corrected || s.id === currentId || out.length < 3) out.push({ s, utts, corrected });
      if (out.length >= 30) break;
    }
    return out;
  },
  env() {
    const n = typeof navigator !== 'undefined' ? navigator : {};
    return {
      ua: n.userAgent || '', cores: n.hardwareConcurrency || null, mem: n.deviceMemory || null,
      engine: SpeakerAI.active && SpeakerAI.active.id, embedMs: Math.round(SpeakerAI.embedMs || 0),
      seg: SegModel.status === 'ready' ? { src: SegModel.srcId, format: SegModel.format, spk: SegModel.nSpk, runMs: Math.round(SegModel.runMs || 0) } : SegModel.status,
      nemo: NemoModel.status === 'off' ? 'off' : { status: NemoModel.status, chunk: NemoModel.chunk, where: NemoModel.where, ort: NemoModel.ortV, probeMs: NemoModel.probeMs, runMs: Math.round(NemoModel.runMs || 0), error: NemoModel.error || undefined },
      speakers: Speakers.list.map(sp => ({ id: String(sp.id).slice(-6), self: !!sp.isSelf, engines: Object.keys(sp.emb || {}), clips: Object.values(sp.emb || {}).map(e => (e.vecs || []).length) })),
    };
  },
  /** a file to send for analysis: labels, timing and how each was decided (the words only when chosen) */
  async exportFile({ words = false, currentId = null } = {}) {
    const sets = await this.forExport(currentId);
    const out = {
      app: 'koeyomi', kind: 'accuracy', v: APP_VERSION, at: Date.now(), env: this.env(),
      summary: this.summarize(sets.filter(x => x.s.reviewed)),               // 確認済みの会話だけ
      summaryAll: this.summarize(sets),                                     // 直した所以外は合っていたとみなした暫定値を含む
      sessions: [],
    };
    for (const { s, utts, corrected } of sets) {
      out.sessions.push({
        name: s.name, startedAt: s.startedAt, reviewed: !!s.reviewed, corrected, cfg: s.cfg || null, input: s.input || null, net: s.net || null,
        clusters: (s.clusters || []).map(c => ({ n: c.n, count: c.count || 0, tracks: c.trackList || null })),
        utts: utts.filter(u => u.text).sort((a, b) => a.at - b.at).map(u => ({
          t: +(((u.at - s.startedAt) / 1000).toFixed(2)), dur: u.dur, auto: u.auto ? this.key(u.auto) : null, final: this.key(u.speaker),
          overlap: !!u.overlap, with: u.with ? u.with.map(w => this.key(w)) : null, mixed: !!u.mixedReport, track: u.track || null,
          cat: this.category(u), chars: (u.text || '').length, lost: !!u.lost, diag: u.diag || null, ...(words ? { text: u.text } : {}),
        })),
      });
    }
    return new Blob([JSON.stringify(out, null, 1)], { type: 'application/json' });
  },
};

function speakerKeyId(sp) {
  if (!sp) return null;
  if (sp.type === 'self') return sp.id || (Speakers.self() && Speakers.self().id) || null;
  if (sp.type === 'person') return sp.id || null;
  return null;
}
function displayText(u) { return Dict.correct(u.text || '', speakerKeyId(u.speaker)); }

/** "＋母（重なり）": who else was talking at the same time */
function overlapText(u) {
  const w = u.with && u.with[0], name = w && (w.type !== 'unknown' || w.cluster) ? speakerInfo(w).name : '';
  return name ? `＋${name}（重なり）` : '声の重なり';
}
/** one chat message (used by the live view and the history view) */
function buildMsg(u, { onWho, play } = {}) {
  const info = speakerInfo(u.speaker);
  const who = h('button', {
    type: 'button', class: 'who' + (info.pending ? ' pending' : ''), style: { '--c': info.color },
    onclick: onWho ? () => onWho(u) : null, 'aria-label': `${info.name}・${fmtClock(u.at)}${onWho ? '（話者を変更）' : ''}`,
  }, h('span', { class: 'avatar sm', style: { '--c': info.color } }, info.initial), h('span', { class: 'name', text: info.name }), h('span', { class: 'time', text: fmtClock(u.at) }),
    u.refining ? h('span', { class: 'tag pulse', text: '話者を分けています…' }) : u.refined ? h('span', { class: 'tag', text: '重なりを分割' }) : null,
    u.overlap ? h('span', { class: 'tag ov', text: overlapText(u) }) : null);
  const text = u.lost ? u.text : displayText(u);
  const bubble = h('div', { class: 'bubble' + (u.lost ? ' lost' : !text && !u.interim && u.awaiting ? ' waiting' : '') });
  if (text) bubble.appendChild(document.createTextNode(text));
  if (u.interim) bubble.append(h('span', { class: 'interim', text: u.interim }), h('span', { class: 'caret' }));
  else if (!text && u.awaiting) bubble.append(h('span', { class: 'interim', text: '（通信の回復を待っています。つながったら文字にします）' }));
  return h('div', { class: 'msg ' + info.side, dataset: { id: u.id } }, who,
    h('div', { class: 'bubble-row' }, bubble, play ? play(u) : null));
}

function speakerChip(label, color) {
  return h('span', { class: 'chip', style: { '--c': color } }, h('span', { class: 'dot' }), label);
}
/** chips for a summarize() result */
function summaryChips(sum, { compact = false } = {}) {
  const out = [];
  if (!sum) return out;
  if (sum.self) { const s = Speakers.self(); out.push(speakerChip(s ? s.name : 'あなた', 'var(--accent)')); }
  for (const p of sum.persons) {
    if (p.startsWith('demo:')) out.push(speakerChip(p.slice(5), 'var(--sp2)'));
    else { const s = Speakers.byId(p); out.push(speakerChip(s ? s.name : '削除された話者', s ? `var(--sp${s.color})` : 'var(--unknown)')); }
  }
  if (compact && sum.clusters.length) out.push(h('span', { class: 'chip plain', text: `不明 ${sum.clusters.length}人` }));
  else for (const n of sum.clusters) out.push(speakerChip(`不明の話者${n}`, 'var(--unknown)'));
  if (sum.loose && !sum.clusters.length) out.push(h('span', { class: 'chip plain', text: '話者不明' }));
  return out;
}
function summaryText(sum) {
  if (!sum || !sum.total) return '話者なし';
  const unknownNote = sum.loose && !sum.clusters.length ? '＋不明' : '';
  return `話者 ${sum.total}人${unknownNote}（登録済み ${sum.registered}人）`;
}

/* ---------- audio player for history ---------- */
const Player = {
  audio: null, playingId: null, url: null, btn: null,
  async toggle(id, btn) {
    if (this.playingId === id) { this.stop(); return; }
    this.stop();
    const rec = await DB.get('audio', id);
    if (!rec) { toast('この発言の音声は保存されていません'); return; }
    this.url = URL.createObjectURL(rec.blob);
    this.audio = new Audio(this.url);
    this.playingId = id; this.btn = btn;
    this.setBtn(true);
    this.audio.onended = () => this.stop();
    try { await this.audio.play(); } catch (e) { this.stop(); toast('音声を再生できませんでした'); }
  },
  setBtn(on) {
    if (!this.btn) return;
    this.btn.setAttribute('aria-pressed', String(on));
    this.btn.setAttribute('aria-label', on ? '停止' : '再生');
    clear(this.btn).appendChild(icon(on ? 'pause' : 'play', 'sm fill'));
  },
  stop() {
    if (this.audio) { this.audio.pause(); this.audio = null; }
    if (this.url) URL.revokeObjectURL(this.url);
    this.setBtn(false);
    this.url = null; this.playingId = null; this.btn = null;
  },
};
function playButton(u) {
  if (!u.hasAudio) return null;
  const b = h('button', { type: 'button', class: 'play-btn', 'aria-label': '再生', 'aria-pressed': 'false' }, icon('play', 'sm fill'));
  b.addEventListener('click', () => Player.toggle(u.id, b));
  return b;
}

/* ---------- speaker change sheet ---------- */
/**
 * ctx: { u, session, canRegister, applyOne(speaker), registerCluster(name), assignCluster(speaker) }
 */
function openSpeakerSheet(ctx) {
  const { u, session } = ctx;
  const info = speakerInfo(u.speaker);
  const body = h('div', { class: 'section' });
  const s = openSheet({ title: '話者の変更', body });
  const preview = h('div', { class: 'panel' },
    h('div', { class: 'label', text: '選んだ発言' }),
    h('div', { style: { fontSize: '17px' }, text: (displayText(u) || u.interim || '').slice(0, 120) }),
    h('div', { class: 'hint', text: `いまの表示: ${info.name}` }));
  body.appendChild(preview);

  const cluster = u.speaker.type === 'unknown' && u.speaker.cluster ? u.speaker.cluster : null;
  if (cluster) {
    const group = h('div', { class: 'section' }, h('h3', { text: `不明の話者${cluster} をまとめて登録` }));
    if (ctx.canRegister) {
      const name = h('input', { class: 'input', id: 'reg-name', placeholder: '例：佐藤さん', maxlength: '20', autocomplete: 'off' });
      group.append(
        h('p', { class: 'hint', text: `この会話で「不明の話者${cluster}」と表示された発言をすべてこの人の発言にし、声を登録します。次からは名前で表示されます。` }),
        h('div', { class: 'field' }, h('label', { for: 'reg-name', text: '名前' }), name),
        h('button', {
          class: 'btn block', type: 'button', onclick: async () => {
            const v = name.value.trim(); if (!v) { name.focus(); toast('名前を入力してください'); return; }
            const ok = await ctx.registerCluster(v); if (ok) s.close();
          },
        }, icon('check'), '名前を付けて登録'));
      const others = Speakers.list;
      if (others.length) {
        group.append(h('div', { class: 'label', text: '登録済みの人だった場合' }),
          h('div', { class: 'chips-select' }, others.map(sp => h('button', {
            type: 'button', onclick: async () => { const ok = await ctx.assignCluster(sp); if (ok) s.close(); },
          }, sp.isSelf ? `${sp.name}（自分）` : sp.name))));
      }
    } else {
      group.append(h('p', { class: 'hint', text: ctx.registerBlockedReason || 'この会話からは登録できません。' }));
    }
    body.appendChild(group);
  }

  const opts = [];
  const me = Speakers.self();
  opts.push({ label: me ? `${me.name}（自分）` : '自分', sp: { type: 'self', id: me ? me.id : undefined } });
  for (const sp of Speakers.list.filter(x => !x.isSelf)) opts.push({ label: sp.name, sp: { type: 'person', id: sp.id } });
  const clusters = (session && session.clusters) || [];
  for (const c of clusters) opts.push({ label: `不明の話者${c.n}`, sp: { type: 'unknown', cluster: c.n } });
  opts.push({ label: '話者不明', sp: { type: 'unknown' } });
  body.appendChild(h('div', { class: 'section' }, h('h3', { text: 'この発言だけ変更' }),
    h('div', { class: 'chips-select' }, opts.map(o => h('button', {
      type: 'button', 'aria-pressed': String(sameSpeaker(o.sp, u.speaker)),
      onclick: async () => { await ctx.applyOne(o.sp); s.close(); },
    }, o.label)))));
  // two voices at once: who was the other one
  if (u.overlap && ctx.applyWith) {
    const cur = u.with && u.with[0];
    body.appendChild(h('div', { class: 'section' }, h('h3', { text: '同時に話していた人（声の重なり）' }),
      h('div', { class: 'chips-select' },
        ...opts.map(o => h('button', { type: 'button', 'aria-pressed': String(!!cur && sameSpeaker(o.sp, cur)), onclick: async () => { await ctx.applyWith(o.sp); s.close(); } }, o.label)),
        h('button', { type: 'button', onclick: async () => { await ctx.applyWith(null); s.close(); } }, '重なっていない'))));
  }
  // test version: mark a bubble that holds more than one person's words
  if (ctx.measure && ctx.setMixed) {
    body.appendChild(h('div', { class: 'switch-row' }, h('div', { class: 'grow' }, h('label', { for: 'mix-report', style: { fontWeight: 700 }, text: 'この吹き出しに、ほかの人の言葉が混ざっている' }),
      h('p', { class: 'hint', text: '精度の測定に使います（動作確認版）。' })),
      switchCtl('mix-report', !!u.mixedReport, v => ctx.setMixed(v), 'ほかの人の言葉が混ざっている')));
  }
  return s;
}
function sameSpeaker(a, b) {
  if (!a || !b || a.type !== b.type) return false;
  if (a.type === 'self') return true;
  if (a.type === 'person') return a.id === b.id;
  return (a.cluster || 0) === (b.cluster || 0);
}

    const label = { granted: '許可されています', denied: '拒否されています', prompt: 'まだ許可されていません', unknown: '確認していません' }[state];
    const color = { granted: 'var(--ok)', denied: 'var(--danger)', prompt: 'var(--warn)', unknown: 'var(--ink-2)' }[state];
    appendKids(clear(permLine), [
      h('span', { style: { color } }, icon(state === 'granted' ? 'check' : state === 'denied' ? 'alert' : 'info')),
      h('div', { class: 'grow' }, h('div', { style: { fontWeight: 700 }, text: 'マイクの使用' }), h('div', { class: 'hint', text: label })),
      state === 'denied'
        ? h('button', { class: 'btn ghost', type: 'button', style: { flex: 'none' }, onclick: () => location.reload() }, icon('refresh'), '再読み込み')
        : state !== 'granted' ? h('button', { class: 'btn', type: 'button', style: { flex: 'none' }, onclick: requestPerm }, '許可する') : null]);
    help.textContent = micHelpText();
    help.hidden = state !== 'denied';
  }
  /** open the mic briefly so the browser reveals every input and its name, then list them */
  async function scanMics(quiet) {
    let st = null;
    try { st = await openMicStream(); }
    catch (e) { if (!quiet) { devNote.textContent = e.message; help.hidden = false; help.textContent = micHelpText(); } perm = null; renderPerm(); return; }
    try { found = await listMics(); } finally { st.getTracks().forEach(t => t.stop()); }
    perm = null; await renderPerm(); renderDevices();
    if (!quiet) toast(`マイクを${Math.max(1, devItems().length - 1)}つ見つけました`);
  }
  async function requestPerm() { await scanMics(false); }
  function devItems() {
    const seen = new Set(), items = [{ id: '', label: '端末の標準マイク' }];
    (found || []).forEach((d, i) => {
      if (!d.deviceId || d.deviceId === 'default' || d.deviceId === 'communications' || seen.has(d.deviceId)) return;
      seen.add(d.deviceId); items.push({ id: d.deviceId, label: d.label || `マイク ${items.length}` });
    });
    return items;
  }
  async function renderDevices() {
    if (!found) { const l = await listMics(); if (l.some(d => d.label)) found = l; }
    const cur = S.get('micDeviceId'), items = devItems();
    const curOk = items.some(i => i.id === cur);
    clear(devBox);
    for (const it of items) devBox.appendChild(h('button', {
      type: 'button', 'aria-pressed': String(curOk ? it.id === cur : it.id === ''),
      onclick: () => { S.set({ micDeviceId: it.id }); renderDevices(); toast(`「${it.label}」を使います`); if (tester) { stopTest(); startTest(); } },
    }, it.label));
    devBox.appendChild(h('button', { type: 'button', onclick: () => scanMics(false) }, icon('refresh', 'sm'), found ? '一覧を更新' : 'マイクを探す'));
    let note = '';
    if (window.KY_PREVIEW) note = 'このプレビュー画面ではマイクを使えません（Claudeの画面の制限です）。ファイルを https のサイトに置いて開くと使えます。';
    else if (!navigator.mediaDevices) note = 'このブラウザではマイクを使えません。https のページで開いているか確認してください。';
    else if (!found) note = '「マイクを探す」を押すと、使えるマイクの一覧が出ます（マイクの許可を求められます）。';
    else if (items.length <= 2) note = 'この端末で使えるマイクは1つです。イヤホンや外付けマイクをつなぐと、ここに出ます。' + (Platform.ios ? 'iPhoneでは、つないだイヤホンのマイクが自動で使われることもあります。' : '');
    else note = 'イヤホンや外付けマイクを使うときは、ここで選びます。';
    devNote.textContent = note;
  }
  if (navigator.mediaDevices && navigator.mediaDevices.addEventListener) {
    const onChange = () => { found = null; renderDevices(); };
    navigator.mediaDevices.addEventListener('devicechange', onChange);
  }

  async function startTest() {
    if (tester) return;
    if (Conversation.running) { toast('聞き取り中はテストできません'); return; }
    const vad = new Vad();
    let voiced = 0, n = 0;
    tester = new MicCapture(f => {
      const db = frameDb(f); vad.push(db); n++; if (vad.speech) voiced++;
      meter.firstChild.style.width = Math.round(clamp((db + 60) / 45, 0, 1) * 100) + '%';
      if (n % 10 === 0) testStatus.textContent = vad.speech ? '声を聞き取っています。この大きさで大丈夫です。' : `入力: ${Math.round(db)} dB（話しかけてください）`;
    }, { source: S.source() === 'file' ? 'mic' : S.source() });
    try { await tester.start(); }
    catch (e) { tester = null; testStatus.textContent = e.message; perm = null; renderPerm(); return; }
    clear(testBtn).append(icon('stop'), '止める');
    perm = null; renderPerm();
    try { found = await listMics(); } catch (e) { }
    renderDevices();
    testTimer = setTimeout(stopTest, 20000);
  }
  function stopTest() {
    clearTimeout(testTimer);
    if (tester) { tester.stop(); tester = null; }
    meter.firstChild.style.width = '0%';
    clear(testBtn).append(icon('mic'), 'テスト');
    testStatus.textContent = '「テスト」を押して話しかけると、入る音の大きさを表示します。';
  }
  testBtn.addEventListener('click', () => tester ? stopTest() : startTest());

  function renderSource() {
    clear(srcBox);
    if (!S.get('testMode')) { srcBox.hidden = true; return; }
    srcBox.hidden = false;
    const opts = Object.entries(INPUT_SOURCES).map(([value, label]) => ({ value, label }));
    const grid = h('div', { class: 'chips-select', role: 'group', 'aria-label': '聞き取る音' });
    for (const o of opts) grid.appendChild(h('button', {
      type: 'button', 'aria-pressed': String(S.get('inputSource') === o.value),
      onclick: () => { S.set({ inputSource: o.value }); renderSource(); LiveView.renderSourceChip(); },
    }, o.label));
    const notes = {
      mic: 'ふだんどおり、マイクの音を聞き取ります。',
      tab: canCaptureTab() ? '開始すると共有する画面を選ぶ画面が出ます。動画などを流しているタブを選び、「タブの音声も共有する」をオンにしてください。' : 'この端末ではブラウザの音声を取り込めません（パソコンの Chrome / Edge で使えます）。スマホでは「音声・動画ファイル」を使ってください。',
      mix: canCaptureTab() ? 'マイクとタブの音声を混ぜて聞き取ります。' : 'この端末ではブラウザの音声を取り込めません（パソコンの Chrome / Edge で使えます）。',
      file: '開始するとファイルを選べます。選んだ音声・動画を再生しながら聞き取ります。',
    };
    srcBox.append(h('span', { class: 'label', text: '聞き取る音（動作確認用）' }), grid, h('p', { class: 'hint', text: notes[S.get('inputSource')] || '' }));
    if (S.get('inputSource') === 'file') srcBox.append(h('div', { class: 'switch-row' },
      h('div', { class: 'grow' }, h('label', { for: 'mic-monitor', style: { fontWeight: 700 }, text: 'ファイルの音をスピーカーで鳴らす' })),
      switchCtl('mic-monitor', S.get('monitorFile'), v => S.set({ monitorFile: v }), 'ファイルの音をスピーカーで鳴らす')));
  }

  const el = h('div', { class: 'section' },
    permLine, help,
    h('div', { class: 'field' }, h('span', { class: 'label', text: '使うマイク' }), devBox, devNote),
    h('div', { class: 'field' }, h('span', { class: 'label', text: '入力のテスト' }),
      h('div', { style: { display: 'flex', gap: '12px', alignItems: 'center' } }, h('div', { style: { flex: '1', minWidth: '0' } }, meter), testBtn), testStatus),
    h('div', { class: 'field' }, h('span', { class: 'label', text: '声を拾う感度' }),
      seg([{ value: 'high', label: '高い' }, { value: 'standard', label: '標準' }, { value: 'low', label: '低い' }], S.get('micSensitivity'), v => { S.set({ micSensitivity: v }); if (tester) { stopTest(); startTest(); } }, '声を拾う感度'),
      h('p', { class: 'hint', text: '離れた人の声を拾いにくいときは「高い」、雑音で文字が出てしまうときは「低い」にします。' })),
    h('div', { class: 'switch-row' }, h('div', { class: 'grow' }, h('label', { for: 'mic-ns', style: { fontWeight: 700 }, text: '雑音を抑える' }),
      h('p', { class: 'hint', text: 'にぎやかな場所で使います。オンにすると、声の聞き分けの精度が下がることがあります。' })),
      switchCtl('mic-ns', S.get('noiseSuppression'), v => S.set({ noiseSuppression: v }), '雑音を抑える')),
    srcBox);
  renderPerm(); renderDevices(); renderSource();
  // Safari only names the microphones while one is open: scan once if access was already granted
  micPermission().then(async p => {
    if (!p || p.state !== 'granted' || window.KY_PREVIEW) return;
    const l = await listMics(); if (!l.some(d => d.label)) scanMics(true);
  });
  micPermission().then(p => { if (p) p.onchange = () => { perm = p; renderPerm(); renderDevices(); }; });
  return { el, destroy: stopTest, renderSource };
}

/* ---------- APIキー: コピーを検知して貼り付け ---------- */
const KeyPaste = {
  awaiting: false, asking: false, lastAsk: 0,
  /**
   * Find a Gemini API key in copied text. Two formats exist:
   *  - "AQ." authentication keys (what AI Studio issues now)
   *  - "AIza" keys (older, still valid)
   * Copied text may carry quotes, "GEMINI_API_KEY=" or invisible characters around the key.
   */
  extractKey(text) {
    if (!text) return null;
    const t = String(text).replace(/[\u200B-\u200D\u2060\uFEFF]/g, '');
    const known = t.match(/AQ\.[A-Za-z0-9_\-.~+\/=]{16,500}/) || t.match(/AIza[0-9A-Za-z_\-]{30,60}/);
    if (known) return { key: known[0], known: true };
    const tok = t.trim().replace(/^(?:export\s+)?(?:[A-Z][A-Z0-9_]*|key|apiKey|api_key)\s*[=:]\s*/, '').replace(/^["'`]+|["'`;,]+$/g, '').trim();
    if (/^[A-Za-z0-9_\-.~+\/=]{30,500}$/.test(tok) && /[A-Za-z]/.test(tok) && /\d/.test(tok) && !/^https?/i.test(tok)) return { key: tok, known: false };
    return null;
  },
  looksLikeKey(t) { return !!this.extractKey(t); },
  mask: t => t.slice(0, 6) + '…' + t.slice(-4),
  markAwaiting() { this.awaiting = true; },
  async silentRead() {
    try {
      const p = await navigator.permissions.query({ name: 'clipboard-read' });
      if (p.state !== 'granted') return null;
      return await navigator.clipboard.readText();
    } catch (e) { return null; }
  },
  relevant() {
    if (this.awaiting) return true;
    if (Settings.get('apiKey')) return false;
    return Onboarding.onKeyStep() || Nav.current === 'settings';
  },
  /** アプリに戻ってきたとき：APIキーをコピーしていれば確認を出す */
  async onReturn() {
    if (this.asking || Date.now() - this.lastAsk < 2000 || !this.relevant()) return;
    this.lastAsk = Date.now();
    const wasAwaiting = this.awaiting; this.awaiting = false;
    const silent = await this.silentRead();
    const found = silent !== null ? this.extractKey(silent) : null;
    if (silent !== null && !found) return;                               // readable and not a key → stay quiet
    if (found && found.key === Settings.get('apiKey')) return;
    if (silent === null && !wasAwaiting && Settings.get('apiKey')) return;
    this.ask(found && found.key);
  },
  ask(known) {
    this.asking = true;
    let s;
    const yes = h('button', { class: 'btn', type: 'button' }, 'はい');
    const no = h('button', { class: 'btn ghost', type: 'button', onclick: () => s.close() }, 'いいえ');
    yes.addEventListener('click', () => {
      // read inside the tap so Safari shows its paste button
      const p = known ? Promise.resolve(known) : (navigator.clipboard && navigator.clipboard.readText ? navigator.clipboard.readText() : Promise.reject(new Error('no clipboard')));
      p.then(t => { s.close(); this.apply(t); }, () => { s.close(); this.apply(null); });
    });
    s = openSheet({
      title: 'APIキーを貼り付けますか？', dialog: true,
      body: h('p', { style: { margin: 0 }, text: known ? `コピーしたAPIキー（${this.mask(known)}）を貼り付けて保存します。` : 'Google AI Studio でコピーしたAPIキーを、ここに貼り付けて保存します。' }),
      actions: [yes, no],
      onClose: () => { this.asking = false; },
    });
  },
  apply(text) {
    const inputs = ['#onb-key', '#set-apikey'].map(sel => $(sel)).filter(Boolean);
    if (text === null || text === undefined) {
      toast('クリップボードを読み取れませんでした。入力欄を長押しして「ペースト」してください。', 4000);
      if (inputs[0]) inputs[0].focus();
      return false;
    }
    const found = this.extractKey(text);
    if (!found) { toast('コピーした内容にAPIキーが見つかりませんでした。AI Studio の「キーをコピー」でコピーしてから、もう一度お試しください。', 4500); return false; }
    const t = found.key;
    Settings.set({ apiKey: t, keyParam: '' });
    inputs.forEach(i => { i.value = t; });
    toast(found.known ? 'APIキーを貼り付けて保存しました' : 'キーを貼り付けて保存しました。接続できない場合は、キーが正しいか確認してください', 3500);
    return true;
  },
  /** 「貼り付け」ボタン */
  pasteNow() {
    if (!navigator.clipboard || !navigator.clipboard.readText) { this.apply(null); return; }
    navigator.clipboard.readText().then(t => this.apply(t), () => this.apply(null));
  },
};
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') setTimeout(() => KeyPaste.onReturn(), 300); });
window.addEventListener('focus', () => setTimeout(() => KeyPaste.onReturn(), 300));

/* ============================================================
   ui-live — 会話（リアルタイム文字起こし）

const STATUS_LABEL = { idle: '待機中', connecting: '接続中', listening: '聞き取り中', reconnecting: '再接続中', offline: '再接続待ち', catchup: '追いつき中', saving: '保存中', error: 'エラー' };

const LiveView = {
  nodes: new Map(), stick: true, timer: 0, lastSession: null,
  mount() {
    const v = $('#view-live');
    this.statusEl = h('span', { class: 'status-pill', 'data-s': 'idle', role: 'status' }, STATUS_LABEL.idle);
    this.timerEl = h('span', { class: 'timer', 'aria-label': '経過時間' });
    this.partEl = h('div', { class: 'participants', 'aria-label': '参加している話者' });
    this.testBadge = h('span', { class: 'badge warn', text: '動作確認', hidden: true });
    this.srcBtn = h('button', { class: 'src-btn', type: 'button', 'aria-label': 'マイクの設定', onclick: () => openMicSheet() }, icon('mic', 'sm'), h('span'));

      h('span', { class: 'brand', text: 'こえよむ' }), this.testBadge, h('div', { class: 'grow' }), this.timerEl, this.statusEl,
      h('div', { class: 'live-row2' }, this.srcBtn, this.partEl));

    this.noticeEl = h('div', { class: 'section', style: { paddingTop: '14px' } });
    this.emptyEl = h('div', { class: 'live-empty' },
      icon('wave'),
      h('p', { class: 'big', text: 'まわりの声を、文字にします' }),
      h('p', { text: '下のマイクを押すと聞き取りを始めます。あなたの発言は右、ほかの人の発言は左に出ます。' }),
      h('button', { class: 'btn soft', type: 'button', onclick: () => this.startDemo() }, icon('play', 'sm fill'), 'デモを見る'));

    this.endEl = h('div', { class: 'section', style: { paddingBottom: '20px' }, hidden: true });

    this.jumpEl = h('button', { class: 'jump', type: 'button', hidden: true, onclick: () => this.toBottom(true) }, icon('down', 'sm'), '最新の発言へ');
    const wrap = h('div', { class: 'chat-wrap' }, this.scrollEl, this.jumpEl);

    this.micBtn = h('button', { class: 'mic', type: 'button', 'aria-label': '聞き取りを開始', onclick: () => this.toggle() }, icon('mic'));
    // (the text size is set in 設定 → 表示)

    }, { passive: true });

    Conversation.on('utt', (u, opt) => this.renderUtt(u, opt));

    Conversation.on('level', l => { this.micBtn.style.setProperty('--level', l.toFixed(3)); });

    Settings.on(p => { if ('apiKey' in p || 'onboarded' in p) this.renderNotices(); });
    SpeakerAI.on(() => this.renderNotices());
    Settings.on(p => { if ('testMode' in p || 'inputSource' in p) this.renderSourceChip(); });
    this.renderNotices(); this.renderStatus('idle'); this.renderSourceChip();
  },
  renderSourceChip() {

    const src = Settings.source();
    this.srcBtn.querySelector('span').textContent = test ? INPUT_SOURCES[src] : 'マイク';
    this.srcBtn.classList.toggle('alt', src !== 'mic');
  },
  show() { this.renderNotices(); this.renderParticipants(); },


  renderNotices() {
    clear(this.noticeEl);
    const add = (kind, text, btnLabel, onBtn, more = []) => this.noticeEl.appendChild(h('div', { class: 'notice' + (kind === 'warn' ? ' warn' : ''), dataset: { kind } },
      icon(kind === 'warn' ? 'alert' : 'info'),

        btnLabel || more.length ? h('div', { class: 'notice-acts' },

    // listening goes on: what is wrong and what can be done about it
    const N = Conversation.running ? Conversation.notices : {};
    if (N.link) {
      const k = N.link.kind;
      if (k === 'auth') add('warn', N.link.text, 'APIキーを確認する', () => Nav.go('settings', 'apikey'), [['今すぐ再接続', () => Conversation.reconnect()]]);
      else if (k === 'model') add('warn', N.link.text, '設定を開く', () => Nav.go('settings'), [['今すぐ再接続', () => Conversation.reconnect()]]);
      else add('warn', N.link.text, '今すぐ再接続', () => Conversation.reconnect());
    }
    if (N.input) {
      if (N.input.kind === 'tab' && !(Conversation.mic && Conversation.mic.kinds.includes('mic'))) add('warn', N.input.text, '共有し直す', () => Conversation.reshareTab());
      else if (N.input.kind === 'tab') add('info', N.input.text, '共有し直す', () => Conversation.reshareTab());
      else add('warn', N.input.text, 'マイクを再開', () => Conversation.restartInput(true), [['マイクの設定', () => openMicSheet()]]);
    }
    if (Conversation.status === 'error' && Conversation.statusDetail) {
      const d = Conversation.statusDetail;
      if (/マイク|音声の処理/.test(d)) add('warn', d, 'マイクの設定を開く', () => openMicSheet());
      else if (/ブラウザの音声|ファイル/.test(d)) add('warn', d, '聞き取る音を変える', () => openMicSheet());
      else add('warn', d, '設定を開く', () => Nav.go('settings', /APIキー/.test(d) ? 'apikey' : undefined));
    }
    const errShown = Conversation.status === 'error' && /APIキー/.test(Conversation.statusDetail);
    if (!Settings.get('apiKey') && !DEBUG.mockws && !errShown) add('warn', '文字起こしには Gemini APIキーが必要です。', 'APIキーを設定する', () => Nav.go('settings', 'apikey'));

    else if (Speakers.self().enrollMode !== 'detailed' && Speakers.self().source === 'enroll' && !Settings.get('hideDetailHint') && !Conversation.running)

  renderStatus(s, d) {

  updateEmpty() {

  resetChat() {
    this.nodes.clear(); clear(this.chatEl); this.endEl.hidden = true; this.timerEl.textContent = ''; this.stick = true; this.jumpEl.hidden = true;
  },
  async toggle() {
    if (Conversation.running) { this.lastSession = Conversation.session; await Conversation.stop(); return; }

  async begin(file) {

      await Conversation.start({ file });

    } catch (e) {
      Conversation.setStatus('error', e.message || String(e));
      this.renderNotices();
    }
  },
  async startDemo() {
    if (Conversation.running) return;
    this.resetChat();
    await Conversation.start({ demo: true });
    this.lastSession = Conversation.session;
    toast('デモの会話を再生しています', 1800);
  },
  renderEnd() {
    const s = this.lastSession; clear(this.endEl);
    if (!s || !this.chatEl.children.length) { this.endEl.hidden = true; return; }
    this.endEl.hidden = false;
    this.endEl.append(h('div', { class: 'notice' }, icon('check'),
      h('div', { class: 'grow' }, h('span', {}, '会話を履歴に保存しました ', h('span', { class: 'mono', text: s.name })),
        h('div', {}, h('button', { class: 'link', type: 'button', onclick: () => Nav.go('detail', s.id) }, (s.clusters || []).length >= 3 ? `不明の話者が${s.clusters.length}人に分かれました。履歴でGeminiに整理させる` : '履歴で見る')))));
    this.toBottom();
  },

  renderUtt(u, opt) {
    if (!Conversation.session || u.sessionId !== Conversation.session.id) return;
    const old = this.nodes.get(u.id);
    const waiting = u.awaiting && !u.text && !u.interim && u.state !== 'open' && u.dur >= 800;   // speech kept for later: show that someone spoke
    if ((opt && opt.removed) || (!u.text && !u.interim && !waiting)) {
      if (old) { old.remove(); this.nodes.delete(u.id); }
      this.updateEmpty(); return;
    }
    const el = buildMsg(u, { onWho: x => this.editSpeaker(x) });
    el.dataset.at = u.at;
    if (old) old.replaceWith(el);
    else {
      // text can come a little late: keep the bubbles in the order they were spoken
      let after = this.chatEl.lastElementChild;
      while (after && after.dataset.at && +after.dataset.at > u.at) after = after.previousElementSibling;
      if (after && after !== this.chatEl.lastElementChild) after.after(el);
      else if (!after && this.chatEl.firstElementChild && this.chatEl.firstElementChild.dataset.at) this.chatEl.prepend(el);
      else this.chatEl.appendChild(el);
    }
    this.nodes.set(u.id, el);
    this.updateEmpty();
    if (this.stick) this.toBottom(); else this.jumpEl.hidden = false;
  },
  /** one mixed utterance became several per-speaker ones */
  replaceUtt(old, parts) {
    if (!Conversation.session || old.sessionId !== Conversation.session.id) return;
    const node = this.nodes.get(old.id);
    for (const p of parts) {
      const el = buildMsg(p, { onWho: x => this.editSpeaker(x) });
      el.dataset.at = p.at;
      if (node) node.before(el); else this.chatEl.appendChild(el);
      this.nodes.set(p.id, el);
    }
    if (node) { node.remove(); this.nodes.delete(old.id); }
    this.updateEmpty();
    if (this.stick) this.toBottom();
  },
  toBottom(smooth) {
    requestAnimationFrame(() => {
      this.scrollEl.scrollTo({ top: this.scrollEl.scrollHeight, behavior: smooth ? 'smooth' : 'auto' });
      this.stick = true; this.jumpEl.hidden = true;
    });
  },
  editSpeaker(u) {
    openSpeakerSheet({
      u, session: Conversation.session, canRegister: false,
      registerBlockedReason: '声の登録は、会話のあと「履歴」から行えます（録音が有効な場合）。',
      applyOne: sp => Conversation.reassign(u, sp),
    });
  },
};

async function toggleStar(s) {
  s.starred = !s.starred;
  await DB.put('sessions', s);
  if (Conversation.session && Conversation.session.id === s.id) Conversation.session.starred = s.starred;
  toast(s.starred ? 'お気に入りにしました。削除できないよう保護されます。' : 'お気に入りを外しました');
}
async function deleteSession(s) {
  if (s.starred) { toast('お気に入りの会話は削除できません。先に ★ を外してください。', 3200); return false; }
  if (Conversation.running && Conversation.session && Conversation.session.id === s.id) { toast('記録中の会話は削除できません'); return false; }
  const ok = await confirmDialog({ title: 'この会話を削除しますか？', message: `${s.name} の文字と音声をすべて削除します。元に戻せません。`, okText: '削除する', danger: true });
  if (!ok) return false;
  await DB.delByIndex('utterances', 'sessionId', s.id);
  await DB.delByIndex('audio', 'sessionId', s.id);
  await DB.del('sessions', s.id);
  toast('削除しました');
  return true;
}

  editSpeaker(u) {

    let reason = '';

      applyWith: async sp => { u.with = sp ? [stripSpeaker(sp)] : null; if (!sp) u.overlap = false; await this.saveUtt(u); this.render(); toast(sp ? '同時に話していた人を変更しました' : '重なりの印を外しました'); },
      applyOne: async sp => { u.speaker = stripSpeaker(sp); await this.saveUtt(u); this.render(); toast('話者を変更しました'); },
      registerCluster: name => this.registerCluster(u.speaker.cluster, { name }),
      assignCluster: sp => this.registerCluster(u.speaker.cluster, { existing: sp }),
    });
  },
  /** 不明の話者N → 新しい話者として登録、または既存の人に統合 */
  async registerCluster(n, { name, existing }) {
    const members = this.utts.filter(x => x.speaker.type === 'unknown' && x.speaker.cluster === n);
    const byEngine = {};
    for (const m of members) if (m.emb) (byEngine[m.emb.engineId] = byEngine[m.emb.engineId] || []).push(Float32Array.from(m.emb.vec));
    if (!Object.keys(byEngine).length) { toast('声のデータがないため登録できません'); return false; }
    const emb = {};
    for (const [eid, vecs] of Object.entries(byEngine)) {
      const take = vecs.slice(0, 10), cen = meanVec(take);
      emb[eid] = { vecs: take, centroid: eid.startsWith('simple') ? cen : l2norm(cen) };
    }
    // keep up to ~15 s of this person's voice so the profile can be rebuilt for a new model
    let enrollAudio = null;
    try {
      const parts = []; let total = 0;
      for (const m of members.slice().sort((a, b) => b.dur - a.dur)) {
        if (!m.hasAudio || total > SR * 15) continue;
        const a = await DB.get('audio', m.id); if (!a) continue;
        const pcm = await decodeWav(a.blob); parts.push(pcm); total += pcm.length;
      }
      if (parts.length) enrollAudio = encodeWav(concatF32(parts));
    } catch (e) { console.warn(e); }

    let sp;
    if (existing) {
      sp = Speakers.byId(existing.id);
      sp.emb = sp.emb || {};
      for (const [eid, set] of Object.entries(emb)) {
        const cur = sp.emb[eid];
        if (cur) { cur.vecs = cur.vecs.concat(set.vecs).slice(-12); cur.centroid = eid.startsWith('simple') ? meanVec(cur.vecs) : l2norm(meanVec(cur.vecs)); }
        else sp.emb[eid] = set;
      }
      if (!sp.enrollAudio && enrollAudio) sp.enrollAudio = enrollAudio;
    } else {
      sp = { id: uid(), name, isSelf: false, color: Speakers.nextColor(), createdAt: Date.now(), source: 'history', emb, enrollAudio };
    }
    await Speakers.save(sp);
    for (const m of members) { m.speaker = sp.isSelf ? { type: 'self', id: sp.id } : { type: 'person', id: sp.id }; await DB.put('utterances', m); }
    this.session.summary = summarize(this.utts.map(x => x.speaker));
    await DB.put('sessions', this.session);
    SpeakerAI.ensureProfiles().catch(() => { });
    this.render();
    toast(existing ? `「${sp.name}」の声として追加しました` : `「${sp.name}」を登録しました`);
    return true;
  },
  async copy() {
    const s = this.session;
    const lines = [`こえよむ ${s.name}`];
    for (const u of this.utts) lines.push(`[${fmtClockSec(u.at)}] ${speakerInfo(u.speaker).name}: ${displayText(u)}`);
    const ok = await copyText(lines.join('\n'));
    toast(ok ? '会話の文字をコピーしました' : 'コピーできませんでした');
  },
};

/* ============================================================
   ui-speakers — 話者登録（音読）・QR共有・QR読み取り
   ============================================================ */
const READ_TEXT = 'こんにちは。これから私の声を登録します。今日は朝から少し曇っていましたが、お昼すぎには晴れてきました。駅前のパン屋さんで、温かいコーヒーとサンドイッチを買いました。来週の水曜日には、家族みんなで動物園へ出かける予定です。';
const MIN_VOICED_SEC = 5, MAX_REC_SEC = 45;

/** 音読の録音UI。onResult(pcm) を呼ぶ */
/**
 * one recording. opts: text (to read, or none), idle / rec (what to tell the person), min / max seconds of voice,
 * stop (the button while recording), onResult(pcm), onState
 */
function EnrollRecorder({ onResult, onState, text = READ_TEXT, idle, rec, min = MIN_VOICED_SEC, max = MAX_REC_SEC, stop: stopLabel = '読み終えた', short } = {}) {
  const meter = h('div', { class: 'meter', 'aria-hidden': 'true' }, h('i'));
  const status = h('span', { text: idle || '準備ができたら「録音を始める」を押して、上の文章を声に出して読んでください。' });
  const clock = h('span', { class: 'mono hint' });
  const btn = h('button', { class: 'btn block', type: 'button' }, icon('mic'), '録音を始める');
  const fileIn = h('input', { type: 'file', accept: 'audio/*,video/*', hidden: true });
  const fileBtn = Settings.get('testMode') ? h('button', { class: 'btn ghost block', type: 'button', onclick: () => fileIn.click() }, icon('play', 'sm fill'), '音声ファイルから登録（動作確認用）') : null;
  const el = h('div', { class: 'section' },
    text ? h('p', { class: 'read-text', text }) : null,
    meter, h('div', { class: 'rec-status' }, status, clock), btn, fileBtn, fileIn);
  const tooShort = sec => short || `声が短いようです（${sec.toFixed(1)}秒）。静かな場所で、文章を最後まで読んでください。`;
  fileIn.addEventListener('change', async () => {
    const f = fileIn.files[0]; fileIn.value = ''; if (!f || busy || mic) return;
    busy = true; btn.disabled = true; status.textContent = 'ファイルを読み込んでいます…';
    try {
      const pcm = await fileToPcm16k(f);
      const v = new Vad(); let vf = 0;
      for (let o = 0; o + FRAME <= pcm.length; o += FRAME) { v.push(frameDb(pcm.subarray(o, o + FRAME))); if (v.speech) vf++; }
      if (vf * 0.02 < min) throw new Error(`声が短いようです（${(vf * 0.02).toFixed(1)}秒）。${min}秒以上、1人の声だけが入ったファイルを選んでください。`);
      setBtn('声の特徴を計算しています…', 'wave');
      await onResult(pcm.subarray(0, SR * 60));
      status.textContent = 'ファイルから登録しました。'; setBtn('録音し直す', 'refresh');
    } catch (e) { status.textContent = e.message || 'ファイルを読み込めませんでした。'; setBtn('録音を始める', 'mic'); }
    busy = false; btn.disabled = false;
  });
  let mic = null, frames = [], vad = null, voiced = 0, startAt = 0, tick = 0, busy = false;
  const setBtn = (label, ic, cls = '') => { btn.className = 'btn block ' + cls; clear(btn).append(icon(ic), label); };
  async function start() {
    frames = []; voiced = 0; vad = new Vad();
    mic = new MicCapture(f => {
      frames.push(f); const db = frameDb(f);
      vad.push(db); if (vad.speech) voiced++;
      meter.firstChild.style.width = Math.round(clamp((db + 60) / 45, 0, 1) * 100) + '%';
      if (frames.length * 0.02 > max) stop();
    });
    try { await mic.start(); }
    catch (e) { mic = null; status.textContent = e.message; return; }
    startAt = Date.now();
    setBtn(stopLabel, 'stop', 'danger');
    status.textContent = rec || '録音中です。文章を最後まで読んでください。';
    onState && onState('recording');
    tick = setInterval(() => { clock.textContent = `${fmtDuration(Date.now() - startAt)}・声 ${Math.round(voiced * 0.02)}秒`; }, 250);
  }
  async function stop() {
    if (!mic) return;
    mic.stop(); mic = null; clearInterval(tick); meter.firstChild.style.width = '0%';
    const sec = voiced * 0.02;
    if (sec < min) {
      status.textContent = tooShort(sec);
      setBtn('もう一度録音する', 'refresh'); onState && onState('idle'); return;
    }
    busy = true; btn.disabled = true; setBtn('声の特徴を計算しています…', 'wave');
    status.textContent = '少しお待ちください。';
    try { await onResult(concatF32(frames)); status.textContent = '登録しました。'; setBtn('録音し直す', 'refresh'); }
    catch (e) { status.textContent = e.message || '登録できませんでした。'; setBtn('もう一度録音する', 'refresh'); }
    busy = false; btn.disabled = false; onState && onState('idle');
  }
  btn.addEventListener('click', () => { if (busy) return; mic ? stop() : start(); });
  return { el, cancel() { if (mic) { mic.stop(); mic = null; clearInterval(tick); } } };
}

/* ---------- 詳しい登録: 4つの短い録音で、会話の中の声まで覚える ---------- */
const READ_TEXT_FAR = '次の角を右に曲がると、小さな図書館があります。借りていた本を返したら、帰りに郵便局にも寄るつもりです。';
const DETAIL_STEPS = [
  { title: 'ふだんの声で読む', how: 'スマホを手に持って、下の文章をふだんの話し方で読んでください。', text: READ_TEXT, min: 6, max: 40, stop: '読み終えた' },
  { title: '会話のように話す', how: '好きな食べ物や最近あったことを、家族と話すときのように15秒ほど話してください。文章はありません。', text: null, min: 8, max: 40, stop: '話し終えた',
    idle: '準備ができたら「録音を始める」を押して、15秒ほど自由に話してください。', rec: '録音中です。ふだんの話し方で、15秒ほど話してください。', short: '声が短いようです。15秒ほど、ふだんの話し方で話してください。' },
  { title: '少し離れて読む', how: 'スマホを机に置いて、1mほど離れたところから下の文章を読んでください。会話のときの聞こえ方を覚えます。', text: READ_TEXT_FAR, min: 4, max: 30, stop: '読み終えた' },
  { title: '短い返事', how: '下の言葉を、ひとつずつ間をあけて、ふだんの調子で言ってください。あいづちや短い返事も聞き分けやすくなります。', text: 'はい。　うん、そうだね。　えっ、ほんと？　ありがとう。　なるほどね。　いいよ。', min: 2.5, max: 25, stop: '言い終えた',
    rec: '録音中です。ひとつずつ間をあけて言ってください。', short: '声が短いようです。6つの言葉を、ひとつずつはっきり言ってください。' },
];

/**
 * how to register a voice: 詳しく (about a minute, 4 recordings — recommended for people who talk often) or
 * 簡易 (read one text). onSave({ pcm | parts, mode }) stores it; throws to ask for another try.
 */
function EnrollFlow({ mode = 'detailed', onSave, intro } = {}) {
  const el = h('div', { class: 'section enroll-flow' });
  let rec = null, step = 0, parts = [];
  const render = () => {
    if (rec) rec.cancel(); rec = null;
    clear(el);
    el.append(seg([{ value: 'detailed', label: '詳しく（約1分）' }, { value: 'quick', label: '簡易（約15秒）' }], mode, v => { mode = v; step = 0; parts = []; render(); }, '登録のしかた'));
    if (mode === 'detailed') {
      const st = DETAIL_STEPS[step];
      el.append(
        h('p', { class: 'hint', style: { margin: 0 }, text: step === 0 ? 'おすすめ。4つの短い録音で、ふだんの話し方・離れたときの声・短い返事まで覚えるので、ほかの人（テレビやラジオの声も）と間違えにくくなります。よく話す人はこちらで登録してください。' : '' }),
        h('div', { class: 'enroll-step' },
          h('div', { class: 'steps', 'aria-label': `手順 ${step + 1} / ${DETAIL_STEPS.length}` }, DETAIL_STEPS.map((_, i) => h('i', { class: i <= step ? 'on' : '' }))),
          h('strong', { text: `${step + 1}/${DETAIL_STEPS.length}　${st.title}` }),
          h('p', { style: { margin: 0 }, text: st.how })),
        (rec = EnrollRecorder({
          text: st.text, idle: st.idle, rec: st.rec, short: st.short, min: st.min, max: st.max, stop: st.stop,
          onResult: async pcm => {
            // each recording has to sound like the first one: another voice or a TV in it would teach the wrong voice
            if (step > 0) {
              const c = await SpeakerAI.sameVoice(parts[0], pcm);
              if (c && c.sim < c.T.create - (step === 2 ? 0.06 : 0)) throw new Error('1つめの録音と声の感じがかなり違いました。ほかの人の声やテレビの音が入っていないか確かめて、もう一度録音してください。');
            }
            parts[step] = pcm;
            if (step < DETAIL_STEPS.length - 1) { step++; setTimeout(render, 450); return; }
            await onSave({ parts: parts.slice(), mode: 'detailed' });
          },
        })).el,
        step > 0 ? h('button', { class: 'link', type: 'button', style: { justifySelf: 'start' }, onclick: () => { step--; render(); } }, '前の手順をやり直す') : null);
    } else {
      el.append(
        h('p', { class: 'hint', style: { margin: 0 }, text: '文章を1回読むだけの登録です。たまに会う人や、まず試してみたいときに。よく話す人は「詳しく」がおすすめです。' }),
        intro ? h('p', { style: { margin: 0 }, text: intro }) : null,
        (rec = EnrollRecorder({ onResult: pcm => onSave({ pcm, mode: 'quick' }) })).el);
    }
  };
  render();
  return { el, cancel() { if (rec) rec.cancel(); } };
}

/** create or update a speaker from enrollment audio */
async function saveEnrollment({ pcm, parts, name, self, existing, mode }) {
  const emb = await SpeakerAI.enrollVectors(parts || pcm);
  if (!Object.keys(emb).length) throw new Error('声の特徴を取り出せませんでした。もう一度録音してください。');
  // the voice itself is kept (on this device) so the prints can be made again for another voice model
  let enrollAudio, enrollSplits = null;
  if (parts) {
    const vs = parts.map(p => voicedOnly(p).subarray(0, SR * 15));
    enrollSplits = vs.map(v => v.length); enrollAudio = encodeWav(concatF32(vs));
  } else enrollAudio = encodeWav(voicedOnly(pcm).subarray(0, SR * 20));
  const enrollMode = mode || (parts ? 'detailed' : 'quick');
  let sp = existing || (self ? Speakers.self() : null);
  if (sp) { sp.emb = emb; sp.enrollAudio = enrollAudio; sp.enrollSplits = enrollSplits; sp.enrollMode = enrollMode; if (name) sp.name = name; sp.source = 'enroll'; }
  else sp = { id: uid(), name, isSelf: !!self, color: self ? 0 : Speakers.nextColor(), createdAt: Date.now(), source: 'enroll', emb, enrollAudio, enrollSplits, enrollMode };
  await Speakers.save(sp);
  if (sp.isSelf) Settings.set({ selfId: sp.id });
  return sp;
}

function openEnrollSheet({ self = false, existing = null, onDone, mode = 'detailed' } = {}) {
  const cur = existing || (self ? Speakers.self() : null);
  const nameInput = h('input', { class: 'input', id: 'enroll-name', maxlength: '20', autocomplete: 'off', placeholder: self ? '例：はなこ' : '例：お母さん', value: cur ? cur.name : '' });
  let flow;
  const s = openSheet({
    title: self ? 'あなたの声を登録' : (existing ? `${existing.name}さんの声を登録し直す` : '一緒に使う人を登録'),
    body: h('div', { class: 'section' },
      h('div', { class: 'field' }, h('label', { for: 'enroll-name', text: self ? 'あなたの呼び名' : '名前（画面に表示されます）' }), nameInput),
      h('p', { class: 'hint', style: { margin: 0 }, text: self ? '声の特徴だけを端末に保存し、あなたの発言を右側に表示します。' : '登録する人に、スマホに向かって話してもらってください。' }),
      (flow = EnrollFlow({
        mode,
        onSave: async ({ pcm, parts, mode }) => {
          const name = nameInput.value.trim() || (self ? '自分' : '');
          if (!name) { nameInput.focus(); throw new Error('名前を入力してから、もう一度録音してください。'); }
          const sp = await saveEnrollment({ pcm, parts, name, self, existing, mode });
          toast(`「${sp.name}」の声を${mode === 'detailed' ? '詳しく' : ''}登録しました`);
          s.close(); onDone && onDone(sp); refreshAfterSpeakerChange();
        },
      })).el),
    onClose: () => flow && flow.cancel(),
  });
}

/* ---------- QR 共有 ---------- */
async function openShareSheet(sp) {
  let eng = SpeakerAI.active;
  if (!(sp.emb && sp.emb[eng.id]) && sp.enrollAudio) { await SpeakerAI.ensureProfiles(); sp = Speakers.byId(sp.id); }
  if (!(sp.emb && sp.emb[eng.id])) {
    const alt = SpeakerAI.engines().find(e => sp.emb && sp.emb[e.id]);
    if (alt) eng = alt;
    else { toast('この人の声データはいまの方式で使えません。声を録り直してください。', 3600); return; }
  }
  const canvasBox = h('div', { class: 'qr-box' });
  const count = h('div', { class: 'countdown', role: 'timer' });
  let exp = 0, refresh = 0, tick = 0;
  const draw = () => {
    const code = SharePayload.encode(sp, eng.id);
    exp = Math.floor(Date.now() / 1000) + SHARE_TTL;
    const qr = QR.encode(code, 'M');
    const c = QR.toCanvas(qr, 6, 4); c.setAttribute('role', 'img'); c.setAttribute('aria-label', `${sp.name}さんの声の共有コード`);
    clear(canvasBox).appendChild(c);
  };
  draw();
  refresh = setInterval(draw, 10000);
  tick = setInterval(() => { count.textContent = `このコードはあと ${Math.max(0, exp - Math.floor(Date.now() / 1000))}秒で無効になります（10秒ごとに更新）`; }, 250);
  openSheet({
    title: `${sp.name}さんの声を共有`,
    body: h('div', { class: 'section' },
      canvasBox, count,
      h('p', { class: 'hint', text: '受け取る人は、こえよむの「話者」タブ →「QRを読み取る」でこの画面を読み取ってください。コードは表示している間だけ更新され、画面を閉じると30秒以内に使えなくなります。' }),
      h('p', { class: 'hint', text: `共有するのは名前と声の特徴（数値）だけです。録音した音声は含みません。方式: ${eng.label}` })),
    onClose: () => { clearInterval(refresh); clearInterval(tick); },
  });
}

/* ---------- QR 読み取り ---------- */
function openScanSheet() {
  const video = h('video', { playsinline: true, muted: true, autoplay: true, 'aria-label': 'カメラの映像' });
  const box = h('div', { class: 'scan-box' }, video, h('div', { class: 'frame' }));
  const status = h('p', { class: 'hint', role: 'status', text: '相手の画面のQRコードを枠に合わせてください。' });
  const result = h('div', { class: 'section', hidden: true });
  const manual = h('textarea', { class: 'input', id: 'scan-manual', rows: '3', placeholder: 'KY1: で始まるコード', style: { minHeight: '90px' } });
  const manualBox = h('details', {},
    h('summary', { class: 'hint', style: { cursor: 'pointer', padding: '6px 0' }, text: 'カメラが使えないときは、コードを貼り付け' }),
    h('div', { class: 'section', style: { paddingTop: '8px' } }, manual, h('button', { class: 'btn ghost', type: 'button', onclick: () => handle(manual.value, true) }, '読み込む')));
  let scanner = null, lastText = '', done = false;
  const s = openSheet({
    title: 'QRを読み取る',
    body: h('div', { class: 'section' }, box, status, result, manualBox),
    onClose: () => scanner && scanner.stop(),
  });
  function handle(text, fromManual) {
    if (done || (!fromManual && text === lastText)) return;
    lastText = text;
    let p;
    try { p = SharePayload.decode(text); }
    catch (e) { status.textContent = e.message; return; }
    if (p.expired) { status.textContent = 'このコードは期限切れです。相手の画面に表示中のコードを読み取ってください。'; return; }
    const eng = SpeakerAI.engines().find(e => crc32(e.id) === p.engineCrc);
    if (!eng) {
      status.textContent = SpeakerAI.status === 'loading'
        ? '声の聞き分けの準備中です。準備が終わってから、もう一度読み取ってください。'
        : '共有元と「声の聞き分け」の方式が違うため取り込めません。両方の端末で 設定 → 声の聞き分け を同じにしてください。';
      return;
    }
    if (Speakers.self() && p.id === Speakers.self().id) { status.textContent = 'これはこの端末のあなた自身のコードです。'; return; }
    done = true; if (scanner) scanner.stop();
    box.hidden = true; manualBox.hidden = true; status.hidden = true;
    const existing = Speakers.byId(p.id);
    const nameIn = h('input', { class: 'input', id: 'scan-name', maxlength: '20', value: existing ? existing.name : p.name });
    result.hidden = false;
    result.append(
      h('div', { class: 'notice' }, icon('check'), h('div', { class: 'grow' }, h('span', { text: existing ? `登録済みの「${existing.name}」さんの声を新しいデータに更新します。` : `「${p.name}」さんの声を受け取りました。` }))),
      h('div', { class: 'field' }, h('label', { for: 'scan-name', text: 'この端末での表示名' }), nameIn),
      h('button', {
        class: 'btn block', type: 'button', onclick: async () => {
          const name = nameIn.value.trim() || p.name;
          const set = { vecs: [p.vec], centroid: p.vec };
          const sp = existing || { id: p.id, isSelf: false, createdAt: Date.now(), color: (p.color >= 1 && p.color <= SPEAKER_COLORS && !Speakers.list.some(x => x.color === p.color)) ? p.color : Speakers.nextColor(), source: 'qr', emb: {}, enrollAudio: null };
          sp.name = name; sp.emb = Object.assign({}, sp.emb, { [eng.id]: set });
          await Speakers.save(sp);
          toast(`「${name}」を登録しました`); s.close(); refreshAfterSpeakerChange();
        },
      }, icon('check'), existing ? '更新する' : '登録する'));
  }
  (async () => {
    try { scanner = new QrScanner(video, t => handle(t)); await scanner.start(); }
    catch (e) { status.textContent = (e && e.name === 'NotAllowedError') ? 'カメラの使用が許可されていません。ブラウザの設定でカメラを許可するか、下からコードを貼り付けてください。' : (e.message || 'カメラを起動できませんでした。'); box.hidden = true; manualBox.open = true; }
  })();
}

function openDictSheet(entry) {
  const isNew = !entry;
  const e = entry ? { ...entry } : { id: uid(), word: '', reading: '', pos: '名詞', speakerId: null, createdAt: Date.now() };
  const word = h('input', { class: 'input', id: 'dict-word', value: e.word, maxlength: '40', autocomplete: 'off', placeholder: '例：佐藤' });
  const reading = h('input', { class: 'input', id: 'dict-reading', value: e.reading, maxlength: '60', autocomplete: 'off', placeholder: '例：さとう' });
  const posGrid = h('div', { class: 'pos-grid', role: 'group', 'aria-label': '品詞' });
  const renderPos = () => {
    clear(posGrid);
    for (const p of POS_LIST) posGrid.appendChild(h('button', {
      type: 'button', 'aria-pressed': String(e.pos === p),
      onclick: () => { e.pos = p; renderPos(); },
    }, p));
  };
  renderPos();
  const spSel = h('div', { class: 'chips-select', role: 'group', 'aria-label': '話者' });
  const renderSp = () => {
    clear(spSel);
    const opts = [{ id: null, label: '全員' }].concat(Speakers.list.map(s => ({ id: s.id, label: s.isSelf ? `${s.name}（自分）` : s.name })));
    for (const o of opts) spSel.appendChild(h('button', {
      type: 'button', 'aria-pressed': String(e.speakerId === o.id),
      onclick: () => { e.speakerId = o.id; renderSp(); },
    }, o.label));
  };
  renderSp();
  const actions = [h('button', {
    class: 'btn block', type: 'button', onclick: async () => {
      e.word = word.value.trim(); e.reading = toHira(reading.value.trim().replace(/\s+/g, ''));
      if (!e.word) { word.focus(); toast('単語を入力してください'); return; }
      if (e.reading && !/^[ぁ-ゖーー]+$/.test(e.reading)) { reading.focus(); toast('読みは ひらがな で入力してください'); return; }
      await Dict.save(e); s.close(); DictView.render();
      toast(isNew ? `「${e.word}」を登録しました。次の聞き取りから使われます。` : '保存しました');
    },
  }, icon('check'), isNew ? '登録する' : '保存する')];
  if (!isNew) actions.push(h('button', {
    class: 'btn danger block', type: 'button', onclick: async () => {
      const ok = await confirmDialog({ title: `「${e.word}」を削除しますか？`, okText: '削除する', danger: true });
      if (!ok) return; await Dict.remove(e.id); s.close(); DictView.render(); toast('削除しました');
    },
  }, icon('trash'), '削除'));
  const s = openSheet({
    title: isNew ? '単語を登録' : '単語を編集',
    body: h('div', { class: 'section' },
      h('div', { class: 'field' }, h('label', { for: 'dict-word', text: '単語' }), word),
      h('div', { class: 'field' }, h('label', { for: 'dict-reading', text: '読み（ひらがな）' }), reading,
        h('p', { class: 'hint', text: '読みのまま文字になったとき（例：さとう → 佐藤）に、登録した表記へ直します。' })),
      h('div', { class: 'field' }, h('span', { class: 'label', text: '品詞（ひとつ選ぶ）' }), posGrid),
      h('div', { class: 'field' }, h('span', { class: 'label', text: '話者' }), spSel,
        h('p', { class: 'hint', text: '特定の人だけが使う言葉は、その人を選ぶと、その人の発言にだけ表記の直しを行います。' }))),
    actions,
  });
}

/** the card at the top of 設定; re-renders itself when sign-in or sync state changes */

      box.append(

        h('div', { class: 'notice-acts' },
          h('button', { class: 'link', type: 'button', onclick: () => Cloud.reset() }, 'もう一度'),
          h('button', { class: 'link', type: 'button', onclick: () => openCloudSetup() }, 'Firebase の設定を変える')));
      return;
    }
    if (st === 'out') {
      appendKids(box, [
        h('p', { class: 'hint', style: { margin: 0 }, text: 'ログインすると、設定・登録した声・辞書が保存され、同じアカウントでログインしたほかの端末でもそのまま使えます。' }),

        LoginForm(),
        h('div', { class: 'notice-acts login-more' },
          h('button', { class: 'link', type: 'button', onclick: () => openOtherDevice() }, 'ほかの端末で開く'),

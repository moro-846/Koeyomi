<title>こえよむ 動作確認版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=BIZ+UDGothic&family=Zen+Maru+Gothic:wght@700&display=swap">
<style>
/* Layout: one-screen app — sticky top bar, scrolling middle, fixed tab bar; conversation text is the hero, sized by the user. */
:root {
  --bg: #eef1f6;
  --surface: #ffffff;
  --surface-2: #e3e8f0;
  --ink: #141c2b;
  --ink-2: #4b5669;
  --line: #d3d9e3;
  --accent: #26408b;          /* 藍 indigo */
  --accent-ink: #ffffff;
  --accent-soft: #dde4f5;
  --self-bg: #26408b;
  --self-ink: #ffffff;
  --danger: #b42318;
  --ok: #157f4f;
  --warn: #9a5b00;
  --star: #c98a00;
  --unknown: #5d6779;
  --sp1: #b4471f; --sp2: #1f7a5c; --sp3: #8a3fa0; --sp4: #946200;
  --sp5: #2b6cb0; --sp6: #b03a62; --sp7: #4d6b00; --sp8: #00707a;
  --shadow: 0 1px 2px rgba(20, 28, 43, .06), 0 4px 16px rgba(20, 28, 43, .06);
  --font-body: "BIZ UDPGothic", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif;
  --font-display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "BIZ UDPGothic", "Hiragino Sans", sans-serif;
  --font-mono: "BIZ UDGothic", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --chat-size: 22px;
  --ui-size: 16px;
  --radius: 14px;
  --tabbar-h: 62px;
  /* sign-in buttons in their usual look (Google: light/dark per Google's guidelines; X: black) */
  --sso-g-bg: #ffffff; --sso-g-ink: #1f1f1f; --sso-g-line: #747775;
  --sso-x-bg: #000000; --sso-x-ink: #ffffff; --sso-x-line: #000000;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c111a; --surface: #161e2c; --surface-2: #1f2a3c; --ink: #e9eef6; --ink-2: #a5b0c2;
    --line: #2a3548; --accent: #9db2f2; --accent-ink: #0c111a; --accent-soft: #1d2a48;
    --self-bg: #2d4797; --self-ink: #ffffff; --danger: #ff8a7a; --ok: #5fd39d; --warn: #f0b456; --star: #f2c14e;
    --unknown: #98a3b6;
    --sp1: #f08a64; --sp2: #5cc79f; --sp3: #cf8be3; --sp4: #e0b24a; --sp5: #7db3ee; --sp6: #ee86a9; --sp7: #a8c95a; --sp8: #5cc6cf;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
    --sso-g-bg: #131314; --sso-g-ink: #e3e3e3; --sso-g-line: #8e918f; --sso-x-line: #4a5568;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c111a; --surface: #161e2c; --surface-2: #1f2a3c; --ink: #e9eef6; --ink-2: #a5b0c2;
  --line: #2a3548; --accent: #9db2f2; --accent-ink: #0c111a; --accent-soft: #1d2a48;
  --self-bg: #2d4797; --self-ink: #ffffff; --danger: #ff8a7a; --ok: #5fd39d; --warn: #f0b456; --star: #f2c14e;
  --unknown: #98a3b6;
  --sp1: #f08a64; --sp2: #5cc79f; --sp3: #cf8be3; --sp4: #e0b24a; --sp5: #7db3ee; --sp6: #ee86a9; --sp7: #a8c95a; --sp8: #5cc6cf;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
  --sso-g-bg: #131314; --sso-g-ink: #e3e3e3; --sso-g-line: #8e918f; --sso-x-line: #4a5568;
  color-scheme: dark;
}
:root[data-font="small"] { --chat-size: 18px; }
:root[data-font="standard"] { --chat-size: 22px; }
:root[data-font="large"] { --chat-size: 28px; }
:root[data-font="xlarge"] { --chat-size: 36px; }

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: var(--ui-size); line-height: 1.55;
  -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 24px; height: 24px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
svg.i.sm { width: 18px; height: 18px; }
svg.i.fill { fill: currentColor; }

/* ---------- shell ---------- */
.app { display: flex; flex-direction: column; height: 100%; max-width: 760px; margin: 0 auto; position: relative; }
html.standalone .app { padding-top: env(safe-area-inset-top, 0px); }
.views { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.topbar {
  display: flex; align-items: center; gap: 10px; padding: 10px 16px; min-height: 56px;
  background: var(--bg); border-bottom: 1px solid var(--line); position: relative; z-index: 2;
}
.topbar h1, .topbar h2 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 21px; letter-spacing: .02em; text-wrap: balance; }
.topbar .grow { flex: 1; min-width: 0; }
.topbar .sub { font-size: 13px; color: var(--ink-2); }
.scroll { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-inline: 16px; overscroll-behavior: contain; }
.scroll > .pad { padding-block: 16px 28px; display: flex; flex-direction: column; gap: 18px; }

.tabbar {
  display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface);
  border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); flex: none;
}
.tabbar button {
  border: 0; background: none; padding: 8px 2px 7px; display: flex; flex-direction: column; align-items: center; gap: 2px;
  font-size: 12px; color: var(--ink-2); min-height: var(--tabbar-h);
}
.tabbar button[aria-current="page"] { color: var(--accent); font-weight: 700; }
.tabbar button[aria-current="page"] svg.i { stroke-width: 2.4; }

/* ---------- buttons & controls ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 10px 18px;
  border-radius: 999px; border: 1px solid transparent; background: var(--accent); color: var(--accent-ink);
  font-weight: 700; font-size: 16px; text-align: center;
}
.btn.ghost { background: transparent; color: var(--accent); border-color: var(--line); }
.btn.soft { background: var(--accent-soft); color: var(--accent); }
.btn.danger { background: transparent; color: var(--danger); border-color: var(--line); }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; cursor: default; }
.icon-btn {
  width: 44px; height: 44px; border-radius: 999px; border: 0; background: transparent; color: var(--ink-2);
  display: inline-flex; align-items: center; justify-content: center; flex: none;
}
.icon-btn:active { background: var(--surface-2); }

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (v === null || v === undefined || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k === 'style' && typeof v === 'object') { for (const [sk, sv] of Object.entries(v)) { if (sk.startsWith('--')) el.style.setProperty(sk, sv); else el.style[sk] = sv; } }
      else if (k === 'dataset') Object.assign(el.dataset, v);
      else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
      else if (k === 'value') el.value = v;
      else if (k === 'checked') el.checked = !!v;
      else if (v === true) el.setAttribute(k, '');
      else el.setAttribute(k, v);
    }
  }
  appendKids(el, kids);
  return el;
}
function appendKids(el, kids) {
  for (const k of kids.flat(Infinity)) {
    if (k === null || k === undefined || k === false) continue;
    el.appendChild(k instanceof Node ? k : document.createTextNode(String(k)));
  }
}

const pad2 = n => String(n).padStart(2, '0');
function sessionName(d) {
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}-${pad2(d.getHours())}-${pad2(d.getMinutes())}-${pad2(d.getSeconds())}`;
}
function fmtDuration(ms) {
  const s = Math.max(0, Math.round(ms / 1000));
  const hh = Math.floor(s / 3600), mm = Math.floor((s % 3600) / 60), ss = s % 60;
  return hh ? `${hh}:${pad2(mm)}:${pad2(ss)}` : `${pad2(mm)}:${pad2(ss)}`;
}
function fmtDurationJa(ms) {
  const m = Math.round(ms / 60000);
  if (ms < 60000) return `${Math.max(1, Math.round(ms / 1000))}秒`;
  if (m < 60) return `${m}分`;
  return `${Math.floor(m / 60)}時間${m % 60 ? (m % 60) + '分' : ''}`;
}
function fmtClock(epoch) { const d = new Date(epoch); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }
function fmtClockSec(epoch) { const d = new Date(epoch); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`; }

function randHex(bytes = 8) {
  const a = new Uint8Array(bytes); crypto.getRandomValues(a);
  return Array.from(a, b => b.toString(16).padStart(2, '0')).join('');
}
const uid = () => randHex(8);
const sleep = ms => new Promise(r => setTimeout(r, ms));

const clamp = (x, a, b) => Math.min(b, Math.max(a, x));

function crc32(str) {
  let c, crc = 0xFFFFFFFF;
  const bytes = new TextEncoder().encode(str);
  for (let i = 0; i < bytes.length; i++) {
    c = (crc ^ bytes[i]) & 0xFF;
    for (let k = 0; k < 8; k++) c = c & 1 ? (c >>> 1) ^ 0xEDB88320 : c >>> 1;
    crc = (crc >>> 8) ^ c;
  }
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

/* Japanese kana helpers (dictionary readings) */
const toHira = s => s.replace(/[ァ-ヶ]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0x60));
const toKata = s => s.replace(/[ぁ-ゖ]/g, ch => String.fromCharCode(ch.charCodeAt(0) + 0x60));
function joinSegments(a, b) {
  if (!a) return b; if (!b) return a;
  const last = a.slice(-1), first = b[0];
  const ascii = c => /[A-Za-z0-9]/.test(c);
  return a + (ascii(last) && ascii(first) ? ' ' : '') + b;
}

/** text without spaces and punctuation (to compare what was heard) */
function plainText(s) { return String(s || '').replace(/[\s、。，．,.!！?？・…「」『』（）()〜~ー-]/g, ''); }
/** add a final to what an utterance already has, unless it is the same words again (a resend after catching up) */
function appendFinal(a, b) {
  const pa = plainText(a), pb = plainText(b);
  if (pb.length >= 4 && pa.endsWith(pb)) return a;
  return joinSegments(a, b);
}

/* ---------- sheets & dialogs ---------- */
const sheetStack = [];
function openSheet({ title, body, actions, onClose, dialog = false, dismissable = true }) {
  const closeBtn = h('button', { class: 'icon-btn', 'aria-label': '閉じる', onclick: () => close() }, icon('close'));
  const panel = h('div', { class: 'sheet', role: 'dialog', 'aria-modal': 'true', 'aria-label': title || '' },
    h('div', { class: 'sheet-head' }, h('h2', { text: title || '' }), dismissable ? closeBtn : null),
    h('div', { class: 'sheet-body' }, body),
    actions && actions.length ? h('div', { class: 'sheet-actions' }, actions) : null);
  const overlay = h('div', { class: 'overlay' + (dialog ? ' dialog' : '') }, panel);
  if (dismissable) overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
  document.body.appendChild(overlay);
  let closed = false;
  function close(reason) {
    if (closed) return; closed = true;
    overlay.remove();
    const i = sheetStack.indexOf(api); if (i >= 0) sheetStack.splice(i, 1);
    onClose && onClose(reason);
  }
  const api = { close, el: panel, body: panel.querySelector('.sheet-body'), setTitle: t => { panel.querySelector('h2').textContent = t; } };
  sheetStack.push(api);
  setTimeout(() => { const f = panel.querySelector('input:not([type=checkbox]):not([type=range]):not([type=file])'); if (f && !f.value) f.focus({ preventScroll: true }); }, 60);
  return api;
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheetStack.length) sheetStack[sheetStack.length - 1].close('esc'); });

function confirmDialog({ title, message, okText = 'OK', cancelText = 'キャンセル', danger = false }) {
  return new Promise(resolve => {
    let done = false;
    const finish = v => { if (done) return; done = true; s.close(); resolve(v); };
    const s = openSheet({
      title, dialog: true,
      body: message ? h('p', { style: { margin: 0 }, text: message }) : null,
      actions: [
        h('button', { class: 'btn ' + (danger ? 'danger' : ''), onclick: () => finish(true) }, okText),
        h('button', { class: 'btn ghost', onclick: () => finish(false) }, cancelText),
      ],
      onClose: () => { if (!done) { done = true; resolve(false); } },
    });
  });
}

function seg(options, value, onChange, label) {
  const wrap = h('div', { class: 'seg', role: 'group', 'aria-label': label || '' });
  for (const o of options) {
    wrap.appendChild(h('button', {
      type: 'button', 'aria-pressed': String(o.value === value),
      onclick: () => { $$('button', wrap).forEach(b => b.setAttribute('aria-pressed', 'false')); wrap.children[options.indexOf(o)].setAttribute('aria-pressed', 'true'); onChange(o.value); },
    }, o.label));
  }
  return wrap;
}
function switchCtl(id, checked, onChange, label) {
  return h('label', { class: 'switch' },
    h('input', { type: 'checkbox', id, checked, role: 'switch', 'aria-label': label || '', onchange: e => onChange(e.target.checked) }),
    h('span'));
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch (e) {
    const ta = h('textarea', { style: { position: 'fixed', top: '-1000px' } }); ta.value = text; document.body.appendChild(ta);
    ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (_) { }
    ta.remove(); return ok;
  }
}

function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script'); s.src = src; s.async = true; s.crossOrigin = 'anonymous';
    s.onload = () => resolve(); s.onerror = () => { s.remove(); reject(new Error('load failed: ' + src)); };
    document.head.appendChild(s);
  });
}

const Settings = {
  data: { ...DEFAULT_SETTINGS },
  listeners: new Set(),
  load() {
    if (window.KY_TEST) this.data.testMode = true;
    try {
      const raw = localStorage.getItem(SETTINGS_KEY);
      if (raw) {
        const saved = JSON.parse(raw);
        if (saved.speakerEngine && !saved.speakerModel) saved.speakerModel = saved.speakerEngine === 'simple' ? 'simple' : (saved.modelUrl ? 'custom' : 'wespeaker-r34');
        delete saved.speakerEngine;
        Object.assign(this.data, saved);
      }
    } catch (e) { }
    return this.data;
  },
  /** input actually used: test sources only in 動作確認モード */
  source() { return this.data.testMode ? (this.data.inputSource || 'mic') : 'mic'; },
  /** opts.remote: the change came from another device (cloud sync), not from this one */
  set(patch, opts = {}) {
    Object.assign(this.data, patch);
    try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(this.data)); } catch (e) { }
    this.listeners.forEach(fn => { try { fn(patch, opts); } catch (e) { console.error(e); } });
  },
  get(k) { return this.data[k]; },
  on(fn) { this.listeners.add(fn); return () => this.listeners.delete(fn); },
};

const STORES = ['kv', 'speakers', 'dict', 'sessions', 'utterances', 'audio'];
const DB = {
  db: null, mem: null,
  /** onChange(store, key, value|null): every local write (cloud sync listens); quiet writes (from sync itself) do not notify */
  onChange: null,
  _notify(store, key, val) { if (this.onChange && store !== 'kv') { try { this.onChange(store, key, val); } catch (e) { console.warn(e); } } },
  putQuiet(store, val) { return this.put(store, val, undefined, { quiet: true }); },
  delQuiet(store, key) { return this.del(store, key, { quiet: true }); },
  async open() {
    try {
      this.db = await new Promise((resolve, reject) => {
        const req = indexedDB.open('koeyomi', 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          db.createObjectStore('kv');
          db.createObjectStore('speakers', { keyPath: 'id' });
          db.createObjectStore('dict', { keyPath: 'id' });
          db.createObjectStore('sessions', { keyPath: 'id' });
          const u = db.createObjectStore('utterances', { keyPath: 'id' });
          u.createIndex('sessionId', 'sessionId');
          const a = db.createObjectStore('audio', { keyPath: 'id' });
          a.createIndex('sessionId', 'sessionId');
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
        req.onblocked = () => reject(new Error('blocked'));
      });
    } catch (e) {
      console.warn('IndexedDB unavailable, using memory', e);
      this.mem = Object.fromEntries(STORES.map(s => [s, new Map()]));
    }
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { }
  },
  get persistent() { return !!this.db; },
  _req(store, mode, fn) {
    return new Promise((resolve, reject) => {
      const tx = this.db.transaction(store, mode);
      const r = fn(tx.objectStore(store));
      tx.oncomplete = () => resolve(r && 'result' in r ? r.result : undefined);
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error);
    });
  },
  _key(store, val) { return store === 'kv' ? null : val.id; },
  async get(store, key) {
    if (this.mem) return this.mem[store].get(key);
    return this._req(store, 'readonly', s => s.get(key));
  },
  async put(store, val, key, { quiet = false } = {}) {
    if (this.mem) this.mem[store].set(store === 'kv' ? key : val.id, val);
    else await this._req(store, 'readwrite', s => store === 'kv' ? s.put(val, key) : s.put(val));
    if (!quiet) this._notify(store, store === 'kv' ? key : val.id, val);
  },
  async del(store, key, { quiet = false } = {}) {
    if (this.mem) this.mem[store].delete(key);
    else await this._req(store, 'readwrite', s => s.delete(key));
    if (!quiet) this._notify(store, key, null);
  },
  async all(store) {
    if (this.mem) return Array.from(this.mem[store].values());
    return this._req(store, 'readonly', s => s.getAll());
  },
  async byIndex(store, index, key) {
    if (this.mem) return Array.from(this.mem[store].values()).filter(v => v[index] === key);
    return this._req(store, 'readonly', s => s.index(index).getAll(key));
  },
  async delByIndex(store, index, key) {
    if (this.mem) { for (const [k, v] of this.mem[store]) if (v[index] === key) this.mem[store].delete(k); return; }
    return new Promise((resolve, reject) => {
      const tx = this.db.transaction(store, 'readwrite');
      const req = tx.objectStore(store).index(index).openKeyCursor(IDBKeyRange.only(key));
      req.onsuccess = () => { const c = req.result; if (c) { tx.objectStore(store).delete(c.primaryKey); c.continue(); } };
      tx.oncomplete = () => resolve(); tx.onerror = () => reject(tx.error);
    });
  },
  async clearAll() {
    if (this.mem) { STORES.forEach(s => this.mem[s].clear()); return; }
    for (const s of STORES) await this._req(s, 'readwrite', st => st.clear());
  },
};

/* ---------- domain helpers ---------- */
const SPEAKER_COLORS = 8;
const POS_LIST = ['名詞', 'サ変名詞', '形容動詞', '固有名詞', '人名', '人名（姓）', '人名（名）', '地名', '組織名', '記号'];
const POS_PRIORITY = { '人名': 0, '人名（姓）': 0, '人名（名）': 0, '固有名詞': 0, '地名': 0, '組織名': 0, 'サ変名詞': 1, '名詞': 1, '形容動詞': 1, '記号': 2 };

const Speakers = {
  list: [],
  async load() { this.list = (await DB.all('speakers')).sort((a, b) => (b.isSelf - a.isSelf) || a.createdAt - b.createdAt); return this.list; },
  byId(id) { return this.list.find(s => s.id === id) || null; },
  self() { return this.list.find(s => s.isSelf) || null; },
  nextColor() {
    const used = new Set(this.list.filter(s => !s.isSelf).map(s => s.color));
    for (let i = 1; i <= SPEAKER_COLORS; i++) if (!used.has(i)) return i;
    return (this.list.length % SPEAKER_COLORS) + 1;
  },
  async save(sp) { await DB.put('speakers', sp); await this.load(); },
  async remove(id) { await DB.del('speakers', id); await this.load(); },
};

const Dict = {
  list: [],
  async load() { this.list = (await DB.all('dict')).sort((a, b) => b.updatedAt - a.updatedAt); return this.list; },
  async save(e) { e.updatedAt = Date.now(); await DB.put('dict', e); await this.load(); },
  async remove(id) { await DB.del('dict', id); await this.load(); },
  /** 認識の手がかりとして Gemini に送る語（優先度順に最大100語） */
  vocabulary(limit = 100) {
    const seen = new Set();
    return this.list.slice()
      .sort((a, b) => ((POS_PRIORITY[a.pos] ?? 1) - (POS_PRIORITY[b.pos] ?? 1)) || b.updatedAt - a.updatedAt)
      .map(e => e.word.trim()).filter(w => w && !seen.has(w) && seen.add(w))
      .slice(0, limit);
  },
  /** 読み（ひらがな/カタカナ）で書き出された箇所を登録語に置き換える */
  correct(text, speakerId) {
    if (!text || !this.list.length) return text;
    let out = text;
    const entries = this.list.filter(e => e.reading && e.reading.length >= 2 && (!e.speakerId || e.speakerId === speakerId))
      .sort((a, b) => b.reading.length - a.reading.length);
    for (const e of entries) {
      for (const form of new Set([toHira(e.reading), toKata(e.reading)])) {
        if (form && form !== e.word && out.includes(form)) out = out.split(form).join(e.word);
      }
    }
    return out;
  },
};

/* ============================================================
   audio — microphone capture @16kHz, voice activity detection, WAV
   ============================================================ */
const SR = 16000;
const FRAME = 320;                // 20 ms @ 16 kHz

const WORKLET_SRC = `
class KyCapture extends AudioWorkletProcessor {
  constructor() {
    super();
    this.ratio = sampleRate / ${SR};
    this.out = new Float32Array(${FRAME}); this.n = 0;
    this.t = 0; this.idx = 0; this.prev = 0;
    if (this.ratio > 1.01) {
      // 2nd-order Butterworth low-pass at 7 kHz before decimation

  _pool(logits, rowsScored) {
    const n = Math.floor(rowsScored / NEMO_SUB), p = new Float32Array(n * NEMO_NS);
    for (let f = 0; f < n; f++) for (let s = 0; s < NEMO_NS; s++) {
      let t = 0; for (let k = 0; k < NEMO_SUB; k++) t += 1 / (1 + Math.exp(-logits[((f * NEMO_SUB) + k) * NEMO_NS + s]));
      p[f * NEMO_NS + s] = t / NEMO_SUB;
    }
    return p;
  }
  /** a step ran: its chunk frames join the FIFO; the oldest move to the cache, which keeps its most telling frames per speaker */
  update(chunkEmb, logits, rowsScored, sil, nchunk) {
    const H = NEMO_HID, S = NEMO_NS, cfg = this.cfg, nc = this.nc, nf = this.nf;
    const probs = this._pool(logits, rowsScored);
    const fr = nf + nchunk;
    let fifo = new Float32Array(fr * H);
    fifo.set(this.fifo.subarray(0, nf * H)); fifo.set(chunkEmb.subarray(0, nchunk * H), nf * H);
    const npop = fr <= cfg.fifo ? 0 : Math.min(Math.max(cfg.update, fr - cfg.fifo), fr);
    if (npop) {
      const n = nc + npop;
      let ce = new Float32Array(n * H), cp = new Float32Array(n * S);
      ce.set(this.embeds.subarray(0, nc * H)); ce.set(fifo.subarray(0, npop * H), nc * H);
      cp.set(this.compressed ? this.probs.subarray(0, nc * S) : probs.subarray(0, nc * S));
      cp.set(probs.subarray(nc * S, (nc + npop) * S), nc * S);
      fifo = fifo.slice(npop * H);
      let rows = n;
      if (n > cfg.cache) { ({ ce, cp } = this._compress(ce, cp, n, sil)); rows = cfg.cache; this.compressed = true; }
      this.nc = rows; this.embeds.set(ce.subarray(0, rows * H)); this.probs.set(cp.subarray(0, rows * S));
    }
    this.nf = fifo.length / H; this.fifo.set(fifo);
  }
  _scores(p, n) {
    const S = NEMO_NS, thr = this.cfg.thr, sc = new Float32Array(n * S), l5 = Math.log(0.5);
    for (let f = 0; f < n; f++) {
      let comp = 0; for (let s = 0; s < S; s++) comp += Math.log(Math.max(1 - p[f * S + s], thr));
      for (let s = 0; s < S; s++) {
        const q = p[f * S + s];
        sc[f * S + s] = q <= 0.5 ? -Infinity : Math.log(Math.max(q, thr)) - Math.log(Math.max(1 - q, thr)) + comp - l5;
      }
    }
    for (let s = 0; s < S; s++) {
      let pos = 0; for (let f = 0; f < n; f++) if (sc[f * S + s] > 0) pos++;
      if (pos < this.minPos) continue;
      for (let f = 0; f < n; f++) if (sc[f * S + s] <= 0) sc[f * S + s] = -Infinity;
    }
    return sc;
  }
  _boost(sc, n, k, b) {
    const col = new Float32Array(n);
    for (let s = 0; s < NEMO_NS; s++) {
      for (let f = 0; f < n; f++) col[f] = sc[f * NEMO_NS + s];
      for (const f of nemoTopK(col, k)) sc[f * NEMO_NS + s] += b;
    }
  }
  _compress(ce, cp, n, sil) {
    const S = NEMO_NS, H = NEMO_HID, cap = this.cfg.cache, nsil = this.cfg.sil;
    const sc = this._scores(cp, n);
    for (let f = cap; f < n; f++) for (let s = 0; s < S; s++) sc[f * S + s] += this.cfg.latest;
    this._boost(sc, n, this.nStrong, -2 * Math.log(0.5));
    this._boost(sc, n, this.nWeak, -Math.log(0.5));
    const ns = n + nsil, sentinel = ns * S, flat = new Float32Array(sentinel);
    for (let s = 0; s < S; s++) {
      for (let f = 0; f < n; f++) flat[s * ns + f] = sc[f * S + s];
      for (let k = 0; k < nsil; k++) flat[s * ns + n + k] = Infinity;
    }
    const sel = nemoTopK(flat, cap);
    for (let i = 0; i < cap; i++) if (flat[sel[i]] === -Infinity) sel[i] = sentinel;
    sel.sort();
    const oe = new Float32Array(cap * H), op = new Float32Array(cap * S);
    for (let i = 0; i < cap; i++) {
      const f = sel[i] === sentinel ? n : Math.min(sel[i] % ns, n);
      if (f === n) oe.set(sil.subarray(0, H), i * H);                     // the learned "silence" frame; its probabilities stay 0
      else { oe.set(ce.subarray(f * H, (f + 1) * H), i * H); op.set(cp.subarray(f * S, (f + 1) * S), i * S); }
    }
    return { ce: oe, cp: op };
  }
}

/* ---------- one stream: audio in, per-10 ms speaker probabilities out ---------- */
class NemoStream {
  constructor(chunk, mem = NEMO_MEM) {
    this.chunk = chunk; this.feat = nemoFeat || (nemoFeat = new NemoFeatures()); this.cache = new NemoCache(mem);
    this.buf = new Float32Array(SR * 8); this.len = 0; this.bufStart = 0; this.chunkStart = 0; this.melIdx = 0; this.first = true; this.emitted = 0;
  }
  get melPerChunk() { return (this.chunk + NEMO_RC) * NEMO_SUB; }
  need() { return this.first ? (this.melPerChunk - 1) * NEMO_HOP + (NEMO_WINLEN >> 1) : this.melPerChunk * NEMO_HOP + NEMO_WINLEN; }
  append(f) {
    if (this.len + f.length > this.buf.length) { const b = new Float32Array(Math.max(this.buf.length * 2, this.len + f.length)); b.set(this.buf.subarray(0, this.len)); this.buf = b; }
    this.buf.set(f, this.len); this.len += f.length;
  }
  /** samples received but not scored yet */
  get backlog() { return this.bufStart + this.len - this.chunkStart; }
  ready() { return this.backlog >= this.need(); }
  async _score(wav, look) {
    const F = this.feat.extract(wav, this.first);
    const cached = this.cache.cached(), crows = this.cache.rows;
    const nenc = Math.ceil(F.rows / NEMO_SUB), ntot = crows + nenc;
    const r = await NemoModel.run(F.data, F.rows, cached, crows, ntot);
    const nchunk = nenc - look;
    this.cache.update(r.chunk, r.logits, ntot * NEMO_SUB, r.sil, nchunk);
    const s = crows * NEMO_SUB, nf = Math.min(F.rows, nchunk * NEMO_SUB), probs = new Float32Array(nf * NEMO_NS);
    for (let i = 0; i < probs.length; i++) probs[i] = 1 / (1 + Math.exp(-r.logits[s * NEMO_NS + i]));
    const start = this.emitted; this.emitted += nf;
    return { probs, nf, start };
  }
  async step() {
    const off = this.chunkStart - this.bufStart, n = this.need();
    const out = await this._score(this.buf.slice(off, off + n), NEMO_RC);
    // next chunk: an uncentred window opens half a transform before its frame
    this.first = false; this.melIdx += this.chunk * NEMO_SUB;
    this.chunkStart = this.melIdx * NEMO_HOP - (NEMO_NFFT >> 1);
    const drop = this.chunkStart - this.bufStart;
    this.buf.copyWithin(0, drop, this.len); this.len -= drop; this.bufStart = this.chunkStart;
    return out;
  }
  /** the end of the audio: score what is left, without look-ahead */
  async flush() {
    const off = this.chunkStart - this.bufStart, tail = this.buf.slice(off, this.len);
    if (!this.feat.numFrames(tail.length, this.first)) return null;
    const out = await this._score(tail, 0);
    this.first = false; this.chunkStart = this.bufStart + this.len;
    return out;
  }
}

/* ---------- the model: in a Web Worker when possible (a step takes a while), otherwise on the page ---------- */
const NEMO_WORKER_SRC = `
let session = null, ortV = '';
const feedsOf = m => ({
  input_features: new ort.Tensor('float32', m.mel, [1, m.rows, ${NEMO_MEL}]),
  cached_embeds: new ort.Tensor('float32', m.cached, [1, m.crows, ${NEMO_HID}]),
  attention_mask: new ort.Tensor('int64', new BigInt64Array(m.ntot).fill(1n), [1, m.ntot]),
});
self.onmessage = async e => {
  const m = e.data;
  try {
    if (m.op === 'open') {
      let last = null;
      for (const b of m.builds) {
        for (const base of b.bases) for (const file of b.files) {
          if (session) break;
          try {
            if (!self.ort || ortV !== b.v) { try { delete self.ort; } catch (x) { self.ort = undefined; } importScripts(base + file); ortV = b.v; }
            ort.env.wasm.wasmPaths = base; ort.env.wasm.numThreads = 1; ort.env.wasm.proxy = false;
            session = await ort.InferenceSession.create(new Uint8Array(m.graph), { executionProviders: ['wasm'], graphOptimizationLevel: 'all', externalData: [{ path: m.dataName, data: new Uint8Array(m.data) }] });
          } catch (err) { last = err; }
        }
        if (session) break;
      }
      m.graph = m.data = null;
      if (!session) throw last || new Error('runtime');
      self.postMessage({ id: m.id, ok: true, v: ortV });
    } else if (m.op === 'run') {
      const t0 = performance.now();
      const o = await session.run(feedsOf(m));
      const ms = performance.now() - t0;
      const logits = Float32Array.from(o.logits.data), chunk = Float32Array.from(o.chunk_embeds.data), sil = Float32Array.from(o.silence_embeds.data);
      self.postMessage({ id: m.id, ok: true, logits, chunk, sil, ms }, [logits.buffer, chunk.buffer, sil.buffer]);
    } else if (m.op === 'close') { try { session && await session.release(); } catch (x) { } session = null; self.close(); }
  } catch (err) { self.postMessage({ id: m.id, ok: false, error: String(err && err.message || err) }); }
};`;

const NemoModel = {
  status: 'idle', progress: 0, error: '', srcId: NEMO_SRC.id, runMs: 0, probeMs: 0, where: '', chunk: NEMO_STD, ortV: '',
  worker: null, session: null, seq: 0, wait: new Map(), listeners: new Set(),
  on(fn) { this.listeners.add(fn); return () => this.listeners.delete(fn); },
  emit() { this.listeners.forEach(fn => { try { fn(this); } catch (e) { console.error(e); } }); },
  get ready() { return this.status === 'ready'; },
  /** chosen in the settings (and the timeline is on) */
  wanted() { return !window.KY_PREVIEW && Settings.get('segOn') !== false && Settings.get('segEngine') === 'nemotron'; },
  async init() {
    if (!this.wanted()) { this.release(); if (this.status !== 'off') { this.status = 'off'; this.emit(); } return; }
    if (this.status === 'ready' || this.status === 'loading') return;
    await this.load();
  },
  async load() {
    this.status = 'loading'; this.progress = 0; this.error = ''; this.emit();
    let graph, data;
    try {
      graph = await fetchModelCached(NEMO_SRC.graph, null, 1e5);
      data = await fetchModelCached(NEMO_SRC.data, p => { this.progress = p; this.emit(); }, 1e8);
    } catch (e) { return this._fail('ダウンロードできませんでした（' + e.message + '）'); }
    if (!this.wanted()) { this.status = 'off'; this.emit(); return false; }
    let last = null;
    try { await this._openWorker(graph, data); this.where = 'worker'; }
    catch (e) {
      last = e; this.release();
      // the files went to the worker: read them again (from this device's copy)
      try {
        graph = await fetchModelCached(NEMO_SRC.graph, null, 1e5); data = await fetchModelCached(NEMO_SRC.data, null, 1e8);
        await this._openPage(graph, data); this.where = 'page';
      } catch (e2) { last = e2; }
    }
    graph = data = null;
    if (!this.where) return this._fail(last && last.step === 'runtime' ? '実行用の部品を読み込めませんでした' : 'この端末では動かせませんでした（' + (last ? last.message : '不明') + '）');
    // speed check with a step of the usual size: 1-second steps on fast devices, 2-second ones otherwise, none if too slow
    try {
      const mel = new Float32Array((NEMO_STD + NEMO_RC) * NEMO_SUB * NEMO_MEL).fill(-16.6), n = (NEMO_STD + NEMO_RC) * NEMO_SUB;
      await this.run(mel.slice(), n, new Float32Array(0), 0, NEMO_STD + NEMO_RC);
      const cr = NEMO_MEM.cache + NEMO_MEM.fifo, cached = new Float32Array(cr * NEMO_HID);
      const t0 = performance.now();
      const r = await this.run(mel.slice(), n, cached, cr, cr + NEMO_STD + NEMO_RC);
      this.probeMs = Math.round(r.ms || performance.now() - t0);
    } catch (e) { this.release(); return this._fail('この端末では動かせませんでした（' + e.message + '）'); }
    const tune = window.__tune || {};
    if (!this.wanted()) { this.release(); this.status = 'off'; this.emit(); return false; }       // switched back meanwhile
    if (this.probeMs > NEMO_STD * 80 * 0.7 && !tune.nemoAnySpeed) { this.release(); this.status = 'slow'; this.error = `この端末では処理が追いつきません（2秒分に ${(this.probeMs / 1000).toFixed(1)} 秒）`; this.emit(); return false; }
    this.chunk = tune.nemoChunk || (this.probeMs <= 500 ? NEMO_FAST : NEMO_STD);
    this.runMs = this.probeMs; this.status = 'ready'; this.emit();
    return true;
  },
  _fail(msg) { this.status = 'failed'; this.error = msg; this.release(); this.where = ''; this.emit(); return false; },
  /** a live conversation found it too slow on this device: back to the standard model until it is chosen again */
  tooSlow(ms) {
    this.release(); this.status = 'slow';
    this.error = `会話中に処理が追いつかなくなったため、標準のモデルに切り替えました（1回 ${(ms / 1000).toFixed(1)} 秒）`;
    this.emit();
  },
  release() {
    if (this.worker) { try { this.worker.postMessage({ op: 'close' }); } catch (e) { } setTimeout(w => { try { w.terminate(); } catch (e) { } }, 3000, this.worker); }
    for (const [, p] of this.wait) p.reject(new Error('closed'));
    this.wait.clear(); this.worker = null;
    if (this.session) { try { this.session.release(); } catch (e) { } }
    this.session = null; this.where = '';
  },
  _call(msg, transfer) {
    const id = ++this.seq;
    return new Promise((resolve, reject) => {
      this.wait.set(id, { resolve, reject });
      try { this.worker.postMessage({ ...msg, id }, transfer || []); } catch (e) { this.wait.delete(id); reject(e); }
    });
  },
  async _openWorker(graph, data) {
    if (typeof Worker === 'undefined' || typeof Blob === 'undefined') throw new Error('no worker');
    const url = URL.createObjectURL(new Blob([NEMO_WORKER_SRC], { type: 'text/javascript' }));
    try { this.worker = new Worker(url); } finally { setTimeout(() => URL.revokeObjectURL(url), 10000); }
    this.worker.onmessage = e => { const m = e.data, p = this.wait.get(m.id); if (!p) return; this.wait.delete(m.id); m.ok ? p.resolve(m) : p.reject(stepError('run', new Error(m.error))); };
    this.worker.onerror = e => { for (const [, p] of this.wait) p.reject(new Error(e.message || 'worker error')); this.wait.clear(); };
    const pref = ortLoaded ? ORT_BUILDS.filter(b => b.v === ortLoaded).concat(ORT_BUILDS.filter(b => b.v !== ortLoaded)) : ORT_BUILDS;
    const r = await Promise.race([
      this._call({ op: 'open', builds: pref, graph, data, dataName: NEMO_SRC.dataName }, [graph, data]),
      sleep(90000).then(() => { throw new Error('timeout'); }),
    ]);
    this.ortV = r.v;
  },
  async _openPage(graph, data) {
    const builds = ortLoaded ? ORT_BUILDS.filter(b => b.v === ortLoaded) : ORT_BUILDS;
    let last = null;
    for (const build of builds) {
      try { await useOrt(build); } catch (e) { last = e; continue; }
      try {
        this.session = await ort.InferenceSession.create(new Uint8Array(graph), { executionProviders: ['wasm'], graphOptimizationLevel: 'all', externalData: [{ path: NEMO_SRC.dataName, data: new Uint8Array(data) }] });
        this.ortV = build.v;
        return;
      } catch (e) { last = stepError('open', e); }
    }
    throw last || stepError('runtime', new Error('runtime'));
  },
  /** one step → { logits (frames × 8), chunk (frames × 512), sil (512), ms } */
  async run(mel, rows, cached, crows, ntot) {
    let r;
    if (this.worker) r = await this._call({ op: 'run', mel, rows, cached, crows, ntot }, [mel.buffer, cached.buffer]);
    else if (this.session) {
      // on the page: one model at a time, shared with the voice model
      const go = async () => {
        const t0 = performance.now();
        const o = await this.session.run({
          input_features: new ort.Tensor('float32', mel, [1, rows, NEMO_MEL]),
          cached_embeds: new ort.Tensor('float32', cached, [1, crows, NEMO_HID]),
          attention_mask: new ort.Tensor('int64', new BigInt64Array(ntot).fill(1n), [1, ntot]),
        });
        return { logits: o.logits.data, chunk: o.chunk_embeds.data, sil: o.silence_embeds.data, ms: performance.now() - t0 };
      };
      const p = SpeakerAI.embedQ.then(go, go);
      SpeakerAI.embedQ = p.catch(() => { });
      r = await p;
    } else throw new Error('not loaded');
    const delay = window.__tune && window.__tune.nemoDelay;          // test only: a slower device
    if (delay) { await sleep(delay); r.ms += delay; }
    this.runMs = this.runMs ? this.runMs * 0.7 + r.ms * 0.3 : r.ms;
    return r;
  },
};

/** the live timeline of who is speaking, from Nemotron (same reading interface as SegTracker) */
class NemoTracker extends SegTracker {
  constructor(opts = {}) {
    super(opts);
    this.onFail = opts.onFail; this.stream = new NemoStream(NemoModel.chunk); this.base = null; this.dead = false; this.steps = 0;
    this.ring = null;                                    // audio is kept by the stream instead
  }
  get stepSec() { return this.stream.chunk * NEMO_SUB * NEMO_HOP / SR; }
  /** how late a change of speaker is known: a whole step, its look-ahead, and the time a step takes */
  get holdSec() {
    const t = window.__tune && window.__tune.nemoHold;
    if (t != null) return t;
    return Math.min(3.5, this.stepSec + NEMO_RC * NEMO_SUB * NEMO_HOP / SR + NemoModel.runMs / 1000 + 0.2);
  }
  get waitMs() { return Math.round(this.holdSec * 1000) + 1500; }
  push(f) {
    if (this.base === null) this.base = this.n;
    this.stream.append(f); this.n += f.length;
  }
  maybeRun() {
    if (this.busy || this.dead || !this.stream.ready()) return;
    this.busy = true;
    this.run().catch(e => { console.warn('nemotron failed', e); this.fail(e.message); }).finally(() => { this.busy = false; });
  }
  async run() {
    while (!this.dead && !this.ended && this.stream.ready()) {
      // falling behind (more than a few steps waiting): this device cannot keep up
      if (this.steps >= 3 && this.stream.backlog > SR * Math.max(6, this.stepSec * 3.5)) return this.fail('slow');
      const r = await this.stream.step();
      if (this.dead) return;
      this.steps++;
      this.took(r);
    }
  }
  took(r) {
    this.integrate(r);
    this.lastEnd = this.base + this.stream.emitted * NEMO_HOP + Math.round(SEG_LOOK * SR);
    this.prune(this.lastEnd);
    if (this.onUpdate) this.onUpdate(this.lastEnd);
  }
  /** the conversation stopped: score the last bit of audio now (the last utterance waits for it) */
  async flush() {
    if (this.ended || this.dead || this.base === null) return;
    this.ended = true;
    while (this.busy) await sleep(30);
    if (this.dead) return;
    this.busy = true;
    try {
      while (this.stream.ready()) this.took(await this.stream.step());
      const r = await this.stream.flush(); if (r) this.took(r);
    } catch (e) { console.warn('nemotron flush', e); }
    finally { this.busy = false; }
  }
  fail(why) {
    if (this.dead) return;
    this.dead = true;
    if (why === 'slow') NemoModel.tooSlow(NemoModel.runMs);
    if (this.onFail) this.onFail(why);
  }
  integrate({ probs, nf, start }) {
    const S = NEMO_NS;
    for (let f = 0; f < nf; f++) {
      const key = Math.floor((this.base + (start + f) * NEMO_HOP) / SR / SEG_CELL);
      let c = this.cells.get(key); if (!c) { c = { w: 0, s: new Map() }; this.cells.set(key, c); }
      c.w += 1;
      for (let k = 0; k < S; k++) { const p = probs[f * S + k]; if (p > 0.02) c.s.set(k, (c.s.get(k) || 0) + p); }
    }
    // voices heard within the last 5 seconds are different people (the model keeps one number per person)
    const endCell = Math.floor((this.base + (start + nf) * NEMO_HOP) / SR / SEG_CELL), on = new Map();
    for (let c = endCell - Math.round(5 / SEG_CELL); c < endCell; c++) {
      const l = this.label(c); if (!l || l === 'none') continue;
      for (const g of segIsOv(l) ? l.slice(3).split(',') : [l]) on.set(g, (on.get(g) || 0) + 1);
    }
    const present = [...on.entries()].filter(([, n]) => n * SEG_CELL >= 0.2).map(([g]) => +g);
    for (let i = 0; i < present.length; i++) for (let j = i + 1; j < present.length; j++) this.apart.add(Math.min(present[i], present[j]) + '|' + Math.max(present[i], present[j]));
  }
}

/* ============================================================
   qr — QR encoder (alphanumeric/byte, model 2), Base45, share payload, scanner
   ============================================================ */
const QR = (() => {
  const ECC_PER_BLOCK = {
    L: [-1, 7, 10, 15, 20, 26, 18, 20, 24, 30, 18, 20, 24, 26, 30, 22, 24, 28, 30, 28, 28, 28, 28, 30, 30, 26, 28, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30],
    M: [-1, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26, 30, 22, 22, 24, 24, 28, 28, 26, 26, 26, 26, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28],
  };
  const NUM_BLOCKS = {
    L: [-1, 1, 1, 1, 1, 1, 2, 2, 2, 2, 4, 4, 4, 4, 4, 6, 6, 6, 6, 7, 8, 8, 9, 9, 10, 12, 12, 12, 13, 14, 15, 16, 17, 18, 19, 19, 20, 21, 22, 24, 25],
    M: [-1, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5, 5, 8, 9, 9, 10, 10, 11, 13, 14, 16, 17, 17, 18, 20, 21, 23, 25, 26, 28, 29, 31, 33, 35, 37, 38, 40, 43, 45, 47, 49],
  };
  const ECL_BITS = { L: 1, M: 0 };
  const ALNUM = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ $%*+-./:';

  function rawModules(ver) {
    let r = (16 * ver + 128) * ver + 64;
    if (ver >= 2) { const na = Math.floor(ver / 7) + 2; r -= (25 * na - 10) * na - 55; if (ver >= 7) r -= 36; }

  _onFinal(sock, text, timing) { this.h.onFinal(text, timing, this._whose(sock, 'final', text, timing)); }
  /** text still on its way for this utterance (so it is not finished without it) */
  expecting(tag) {
    if (!tag) return false;
    return [this.active, this.pending].some(s => s && !s.closed && s.align.expecting(tag)) || this._oldSocks().some(s => s.align.expecting(tag));
  }
  expectingAny() { return Math.max(0, ...[this.active, this.pending, ...this._oldSocks()].map(s => s && !s.closed ? s.align.busy() : 0)); }
  /**
   * stopping: wait for the words still on their way — as long as the service is visibly answering (up to `ms`),
   * but only briefly for speech it has said nothing about yet (it may have been a cough)
   */
  finish(ms, weakMs = 2500) {
    const t0 = Date.now();
    return new Promise(res => {
      const chk = () => {
        const t = Date.now() - t0, b = t >= 400 ? this.expectingAny() : 2;
        if (this.stopped || t > ms || b === 0 || (b === 1 && t >= weakMs)) res(); else setTimeout(chk, 120);
      };
      setTimeout(chk, 120);
    });
  }
  _oldSocks() { return (this.old || []).filter(s => !s.closed); }
  _onServerError(sock, err) { console.warn('server error', err); }
  _onSocketClose(sock, ev) {
    if (sock.draining || sock.discarded || this.stopped) return;
    const aliveS = Math.round((Date.now() - sock.openedAt) / 1000) + 's';
    if (!this.quietLog) ConnLog.add('close', { code: ev && ev.code, reason: ((ev && ev.reason) || '').slice(0, 120), alive: aliveS, ready: !!sock.readyAt, msgs: sock.msgs, rotating: sock === this.pending });
    if (sock === this.pending) { this.pending = null; this.rotateBlockedUntil = Date.now() + 30000; return; }   // the current one keeps working
    if (sock !== this.active) return;
    this.active = null;
    clearInterval(this.replayTimer); this.replayTimer = 0; this.wait = null;
    this._requeue();
    const reason = (ev && ev.reason) || '', code = ev && ev.code;
    const kind = classifyClose(code, reason, !!sock.readyAt);
    // "AQ." auth keys: if the key parameter is refused, try passing it as an access token once
    if (kind === 'auth' && !this.triedAlt && /^AQ\./.test(this.apiKey || '')) {
      this.triedAlt = true;
      this.authParam = this.authParam === 'key' ? 'access_token' : 'key';
      this.h.onStatus('connecting');
      this._connect();
      return;
    }
    if (sock.readyAt && Date.now() - sock.readyAt > 30000) this.fails = 0;
    const n = ++this.fails;
    const wait = kind === 'network' ? Math.min(15000, 500 * 2 ** (n - 1))
      : kind === 'quota' ? Math.min(300000, 30000 * 2 ** Math.min(n - 1, 4))
        : Math.min(120000, 15000 * 2 ** Math.min(n - 1, 3));
    const offline = typeof navigator !== 'undefined' && navigator.onLine === false;
    this.trouble = { kind, code, reason, since: (this.trouble && this.trouble.since) || Date.now(), retryAt: Date.now() + wait };
    const m = this.troubleText(kind, reason, offline);
    this.h.onTrouble(kind, m.head + '聞き取りと録音は続けています。' + m.next + m.why, { quiet: kind === 'network' && n < 3 && !offline, retryAt: this.trouble.retryAt, short: m.head + m.why });
    this.h.onStatus(kind === 'network' ? 'reconnecting' : 'offline');
    if (!this.quietLog) ConnLog.add('retry', { kind, after: Math.round(wait / 100) / 10 + 's', tries: n });
    this.timer = setTimeout(() => this._connect(), wait);
  }
  troubleText(kind, reason, offline) {
    const why = reason ? `\n（${reason}）` : '';
    if (kind === 'quota') return { head: 'Gemini の利用上限（無料枠）に達したため、文字起こしが止まっています。', next: '上限が戻りしだい自動でつなぎ直し、直近2分ほどの発言も文字にします。', why };
    if (kind === 'auth') return {
      head: /^AQ\./.test(this.apiKey || '') ? 'このAPIキー（AQ. で始まる新しい形式）では接続できませんでした。' : 'APIキーが正しくないか、使えない状態です。',
      next: '設定でAPIキーを直すと、すぐにつなぎ直します。', why,
    };
    if (kind === 'model') return { head: 'モデル「' + Settings.get('liveModel') + '」が見つかりません。', next: '設定でモデル名を直すと、すぐにつなぎ直します。', why };
    if (kind === 'config') return { head: 'Geminiに接続できませんでした。', next: '自動でつなぎ直しています。', why };
    return { head: offline ? 'インターネットにつながっていません。' : '通信が切れています。', next: 'つながりしだい、その間の発言（直近2分ほど）も文字にします。', why: '' };
  }
}

/** quick connection check used by 設定 > 接続テスト */
function testLiveConnection(apiKey) {
  return new Promise(resolve => {
    let finished = false;
    const t = new LiveTranscriber({
      onInterim() { }, onFinal() { },
      onStatus(s) { if (s === 'listening') done(true, ''); },
      onTrouble(kind, msg, info) {
        if (!kind) return;
        done(false, kind === 'network' ? 'Geminiに接続できませんでした。通信状況とAPIキーを確認してください。' + (t.trouble && t.trouble.reason ? `\n（${t.trouble.reason}）` : '') : info.short);
      },
    });
    const done = (ok, msg) => { if (finished) return; finished = true; t.stop(); resolve({ ok, msg }); };
    const prev = Settings.data.apiKey; Settings.data.apiKey = apiKey;
    t.quietLog = true;
    try { t.start(); } catch (e) { done(false, e.message); }
    Settings.data.apiKey = prev;
    setTimeout(() => done(false, '応答がありません。通信状況とAPIキーを確認してください。'), 12000);
  });
}

/* ============================================================
   conversation — live session: audio → VAD → utterances → Gemini text
                  + speaker identification + saving to history
   ============================================================ */
const MAX_UTT_MS = 20000, PROVISIONAL_MS = 1600, SETTLE_MS = 4000;
/**
 * voice-change checks while someone is talking.
 * win/hop: the stretch of voice compared and how often (s); need: how much changed voice confirms a new person (s);
 * hold: audio is sent to Gemini this much later, so that the end of a turn can still be placed exactly
 * where the voice changed — then the text splits there too, not only the bubble.
 */
const SWITCH_PROFILES = {
  normal: { win: 1.5, hop: 0.5, need: 0.5, hold: 0 },
  often: { win: 1.0, hop: 0.25, need: 0.25, hold: 0.9 },
  max: { win: 0.8, hop: 0.2, need: 0.4, hold: 1.3 },
};
const WIN_MARGIN = { model: 0.05, simple: 0.06 };      // how far below "same person" a window must fall to count as another voice
const MIN_NEW_SPEAKER_SEC = 1.5;
const VETO_MIN_SEC = 1.0;
const VERIFY_AFTER = 2.5;                             // seconds into one voice (per the timeline) before the voice print double-checks it                              // a clip this long is enough for the voice print to overrule the timeline                       // shorter clips never found a new unknown person
const MAX_UNKNOWN_GROUPS = 8;
const FINAL_LAG_MS = 1500;                             // a final this soon after we end an utterance answers that utterance
const ADAPT_K = 1.5, ADAPT_FLOOR = 0.15, MERGE_SLACK = 0.02;
const LOST_TEXT = '（通信が切れていたため、文字にできませんでした）';
const STALL_MS = 12000;                                // no audio frames this long: rebuild the input

const Conversation = {
  running: false, demo: false, session: null, utts: [], open: null, interimTarget: null,
  mic: null, vad: null, tr: null, preroll: [], sendBuf: [], level: 0, wakeLock: null, demoTimer: 0,
  ev: { utt: new Set(), status: new Set(), level: new Set(), meta: new Set(), replace: new Set(), notice: new Set() },
  status: 'idle', statusDetail: '', notices: { link: null, input: null }, source: 'mic', lastFrameAt: 0, watchdog: 0, restarting: false,
  on(type, fn) { this.ev[type].add(fn); return () => this.ev[type].delete(fn); },
  emit(type, ...a) { this.ev[type].forEach(fn => { try { fn(...a); } catch (e) { console.error(e); } }); },
  setStatus(s, d = '') { this.status = s; this.statusDetail = d; this.emit('status', s, d); },
  /** problems shown above the chat while listening continues: link (Gemini connection) / input (mic, shared tab) */
  setNotice(slot, n) {
    const a = this.notices[slot], same = (!a && !n) || (a && n && a.kind === n.kind && a.text === n.text);
    this.notices[slot] = n; if (!same) this.emit('notice');
  },

  newSession(demo) {
    const now = new Date();
    return {
      id: uid(), name: sessionName(now), startedAt: now.getTime(), endedAt: null, starred: false,
      recorded: !!Settings.get('record'), demo: !!demo, clusters: [], utteranceCount: 0, preview: '', summary: null, live: true,
    };
  },

  async start({ demo = false, file = null } = {}) {
    if (this.running) return;
    this.demo = demo; this.utts = []; this.open = null; this.interimTarget = null; this.preroll = []; this.sendBuf = []; this.line = []; this.sentTag = null; this.suspectAt = 0; this.suspectVoiceAt = 0; this.freezeAt = 0; this.freezeSince = 0; this.splitting = false;
    this.alias = {}; this.gone = new Map(); this.adapt = {};
    this.session = this.newSession(demo);
    this.emit('meta');
    if (demo) {
      this.running = true; this.setStatus('listening');
      await DB.put('sessions', this.session);
      this.playDemo();
      return;
    }
    if (!Settings.get('apiKey') && !DEBUG.mockws) throw new Error('Gemini APIキーが未設定です。設定画面で入力してください。');
    this.setStatus('connecting');
    this.notices = { link: null, input: null }; this.emit('notice');
    this.vad = new Vad();
    this.sampleN = 0; this.trackSpk = {}; this.seg = null; this.nemoOff = false; this.attachSeg();
    this.session.cfg = { engine: SpeakerAI.active.id, seg: this.seg ? this.segSrc() : null, switch: Settings.get('speakerSwitch'), strict: Settings.get('strictness'), v: APP_VERSION };
    // the transcriber never stops by itself: problems are shown, listening and recording go on
    this.tr = new LiveTranscriber({
      onInterim: (t, tm, tag) => this.onInterim(t, tm, tag),
      onFinal: (t, tm, tag) => this.onFinal(t, tm, tag),
      onStatus: s => {
        if (!this.running) return;
        if (s === 'listening' || s === 'catchup') this.setNotice('link', null);
        this.setStatus(s);
      },
      onTrouble: (kind, msg, info) => { if (this.running) this.setNotice('link', kind && !info.quiet ? { kind, text: msg } : null); },
      onDone: tag => this.onCaughtUp(tag),
      onDropped: tag => this.onDropped(tag),
      onRequeue: tags => this.onRequeue(tags),
    });
    const source = this.source = Settings.source();
    this.session.input = source === 'mic' ? null : INPUT_SOURCES[source] + (file ? `：${file.name}` : '');
    this.mic = new MicCapture(f => this.onFrame(f), { source, file, monitor: Settings.get('monitorFile'), onEnded: r => this.onInputEnded(r) });
    try {
      await this.mic.start();
    } catch (e) { this.mic = null; this.setStatus('idle'); throw e; }
    this.running = true;
    await DB.put('sessions', this.session);
    try { this.tr.start(); } catch (e) { this.mic.stop(); this.mic = null; this.running = false; this.setStatus('idle'); throw e; }
    this.acquireWakeLock();
    this.lastFrameAt = Date.now();
    clearInterval(this.watchdog);
    this.watchdog = setInterval(() => this.checkInput(), 2000);
  },

  async stop({ keepStatus = false } = {}) {
    if (!this.running) return;
    this.running = false;
    clearTimeout(this.demoTimer); clearInterval(this.watchdog);
    if (this.mic) { this.mic.stop(); this.mic = null; }
    if (this.seg && this.seg.flush) this.seg.flush();          // the high-accuracy timeline: score the last bit now
    if (this.open) this.closeUtt(this.open, 'stop');
    this.release(true);                                        // nothing waits in the send line any more
    this.releaseWakeLock();
    if (!keepStatus) this.setStatus('saving');
    this.level = 0; this.emit('level', 0);
    this.notices = { link: null, input: null }; this.emit('notice');
    const session = this.session;
    if (this.tr) {
      const tr = this.tr;
      if (tr.isLive() && tr.backlog() > 0) await tr.drain(45000);   // still catching up: finish that first
      tr.endTurn();
      if (DEBUG.mockws) (window.__pick = window.__pick || []).push({ t: Date.now() % 100000, ev: 'finish', busy: tr.expectingAny() });
      await tr.finish(10000);                                    // the last words may still be on their way (a slow line)
      if (DEBUG.mockws) (window.__pick = window.__pick || []).push({ t: Date.now() % 100000, ev: 'finished', busy: tr.expectingAny() });
      tr.stop();
      session.net = tr.lag.stats();                              // how late the service answered (for the test version's export)
    }
    await sleep(this.demo ? 0 : 300);
    for (const u of this.utts.filter(u => u.state !== 'done')) await this.settle(u, true);
    if (session !== this.session) return;
    if (!this.demo) { this.mergeClusters(); this.promoteClusters(); await this.dissolveStrays(); await this.renumberClusters(); await this.finishOverlaps(); }
    session.endedAt = Date.now(); session.live = false;
    if (!this.utts.some(u => u.state === 'done' && u.text)) { await DB.del('sessions', session.id); this.session = null; }
    else await this.saveSession();
    this.tr = null;
    if (!keepStatus) this.setStatus('idle');
    this.emit('meta');
  },

  /** an input went away. Only the end of a test file stops; the mic is reopened, a shared tab can be shared again */
  onInputEnded(reason) {
    if (!this.running) return;
    if (reason === 'file') {
      toast('ファイルの再生が終わったので、聞き取りを止めます', 3000);
      setTimeout(() => { if (this.running) this.stop(); }, 1200);
      return;
    }
    if (reason === 'mic') { this.restartInput(); return; }
    if (reason === 'tab') {
      if (this.mic && this.mic.kinds.includes('mic')) {
        this.mic.remove('tab');
        this.setNotice('input', { kind: 'tab', text: 'ブラウザの音声の共有が終わりました。マイクだけで聞き取りを続けています。' });
      } else {
        this.setNotice('input', { kind: 'tab', text: 'ブラウザの音声の共有が終わりました。聞き取りは止めていません。「共有し直す」で続けられます。' });
      }
    }
  },
  /** mic gone (unplugged, taken by a call, permission hiccup…) or silent for too long: keep trying to get it back */
  async restartInput(full = false) {
    if (this.restarting) { if (this.poke) this.poke(); return; }   // already trying: try again right now
    if (!this.running || this.demo) return;
    this.restarting = true;
    const sess = this.session;
    let n = 0;
    try {
      while (this.running && this.session === sess) {
        try {
          if (!full && this.mic && this.mic.usable) await this.mic.reopen('mic');
          else {
            const m = new MicCapture(f => this.onFrame(f), { source: 'mic', onEnded: r => this.onInputEnded(r) });
            await m.start();
            if (!this.running || this.session !== sess) { m.stop(); break; }
            if (this.mic) this.mic.stop();
            this.mic = m;
          }
          this.lastFrameAt = Date.now();
          this.setNotice('input', null);
          toast('マイクを再開しました', 1600);
          break;
        } catch (e) {
          full = full || !(this.mic && this.mic.usable);
          this.setNotice('input', { kind: 'mic', text: 'マイクの音が届かなくなりました。聞き取りは止めずに、マイクの再開を試みています。' + (e && e.message ? `\n（${e.message}）` : '') });
          await new Promise(r => { const t = setTimeout(r, Math.min(10000, 2000 * ++n)); this.poke = () => { clearTimeout(t); r(); }; });
          this.poke = null;
        }
      }
    } finally { this.restarting = false; this.poke = null; }
  },
  /** the user shares a tab again (needs their tap) */
  async reshareTab() {
    if (!this.running || !this.mic) return;
    try { await this.mic.reopen('tab'); this.lastFrameAt = Date.now(); this.setNotice('input', null); toast('ブラウザの音声の聞き取りを再開しました', 1800); }
    catch (e) { toast(e.message || String(e), 3000); }
  },
  /** every 2 s: audio frames still coming? */
  checkInput() {
    if (!this.running || this.demo || !this.mic || this.restarting) return;
    const micInput = this.source === 'mic' || this.source === 'mix';
    if (micInput && this.mic.kinds.includes('mic') && !this.mic.alive('mic')) { this.restartInput(); return; }   // in case 'ended' never fired
    const gap = Date.now() - this.lastFrameAt;
    if (gap < 3000) return;
    this.mic.resume();
    if (micInput && gap > STALL_MS && document.visibilityState === 'visible') this.restartInput(true);
  },
  /** back to the app (screen on, tab shown): make sure everything is still running */
  wake() {
    if (!this.running || this.demo) return;
    if (this.mic) this.mic.resume();
    if (!this.wakeLock) this.acquireWakeLock();
    if (this.mic && this.mic.kinds.includes('mic') && !this.mic.alive('mic')) this.restartInput();
    if (this.tr && this.tr.trouble && this.tr.trouble.kind === 'network') this.tr.reconnectNow();
  },
  /** the user asked to reconnect now */
  reconnect() { if (this.running && this.tr) this.tr.reconnectNow(); },

  /* ---------- audio path ---------- */
  onFrame(f) {
    if (!this.running) return;
    this.lastFrameAt = Date.now();
    this.sampleN += f.length;
    if (!this.seg) this.attachSeg();
    if (this.seg) { this.seg.push(f); this.seg.maybeRun(this.segStep()); }
    const db = frameDb(f);
    this.level = Math.max(db > -60 ? clamp((db + 60) / 45, 0, 1) : 0, this.level * 0.85);
    this.emit('level', this.level);
    this.preroll.push(f); if (this.preroll.length > 20) this.preroll.shift();
    const ev = this.vad.push(db);
    if (ev === 'start') this.openUtt(true);
    else if (this.open) { this.open.audio.push(f); this.open.samples += f.length; }
    if (ev === 'end' && this.open) this.closeUtt(this.open, 'vad');
    this.sendBuf.push(f);
    if (this.sendBuf.length >= 5) {
      // tagged with the utterance it belongs to: if the connection is down it is kept and sent later
      this.line.push({ b64: i16ToBase64(f32ToI16(concatF32(this.sendBuf))), at: Date.now() - this.sendBuf.length * 20, tag: this.open ? this.open.id : null });
      this.sendBuf = [];
    }
    this.release();
    const u = this.open;
    if (u) {
      const ms = u.samples / SR * 1000, sw = this.winCfg();
      if (!u.provisional && ms >= PROVISIONAL_MS) { u.provisional = true; this.identify(u, false); }
      if (!this.seg && u.samples >= sw.win * SR && u.samples - u.lastWin >= sw.hop * SR && !this.winBusy) this.checkWindow(u, sw);
      // with the timeline: it sometimes hears two similar voices as one. On a long stretch, the voice print checks it too
      else if (this.seg && this.verifyOn() && u.samples >= VERIFY_AFTER * SR) { const vw = this.verifyCfg(); if (u.samples - u.lastWin >= vw.hop * SR && !this.winBusy && !this.splitting) this.checkWindow(u, vw); }
      if (u.state === 'open' && ms >= MAX_UTT_MS) { this.closeUtt(u, 'split'); this.openUtt(false); }
    }
    this.tr.maybeRotate(!this.vad.speech);
  },
  switchCfg() { return SWITCH_PROFILES[Settings.get('speakerSwitch')] || SWITCH_PROFILES.often; },
  /** voice-print checks next to the timeline: only with a real voice model, and slower (the timeline does most of the work) */
  verifyOn() { return !(window.__tune && window.__tune.noVerify) && SpeakerAI.kindOf(SpeakerAI.active && SpeakerAI.active.id) === 'model' && !this.demo; },
  verifyCfg() {
    const sw = this.switchCfg(), cost = SpeakerAI.costMs() / 1000;
    const hop = Math.max(1.0, Math.min(2.0, cost * 4));      // at most about a quarter of the device's time
    return { ...sw, win: Math.max(1.5, sw.win), hop, need: hop, verify: true };
  },

  /* ---------- who is speaking when (segmentation model) ---------- */
  attachSeg() {
    if (this.seg || this.demo || Settings.get('segOn') === false) return;
    // the high-accuracy model (試験) when chosen and working; the standard one otherwise
    if (NemoModel.ready && !this.nemoOff) this.seg = new NemoTracker({ onUpdate: end => this.onSeg(end), onFail: why => this.segFailed(why) });
    else if (SegModel.ready) this.seg = new SegTracker({ onUpdate: end => this.onSeg(end) });
    else return;
    this.seg.n = this.sampleN;
    if (this.session && this.session.cfg) this.session.cfg.seg = this.segSrc();
  },
  segSrc() { return this.seg instanceof NemoTracker ? NemoModel.srcId + '/' + NemoModel.chunk + (NemoModel.where === 'page' ? 'p' : '') : SegModel.srcId; },
  /** the high-accuracy timeline stopped (too slow here, or an error): the standard one takes over from now */
  segFailed(why) {
    if (!(this.seg instanceof NemoTracker)) return;
    this.nemoOff = true; this.seg = null; this.trackSpk = {};
    if (this.open) { this.open.segLabel = null; this.open.prevLabel = null; }
    this.attachSeg();
    if (this.session && this.session.cfg) this.session.cfg.segFallback = why === 'slow' ? 'slow' : 'error';
  },
  segStep() {
    const base = { normal: 1.0, often: 0.5, max: 0.25 }[Settings.get('speakerSwitch')] || 0.5;
    return Math.max(base, Math.min(1.5, SegModel.runMs * 3 / 1000));     // never more than about a third of the device's time
  },
  wallOfSample(u, smp) { return u.at + Math.round((smp - u.s0) / SR * 1000); },
  /**
   * the timeline moved on: cut the open utterance where another person took over, or where two people
   * started (or stopped) talking at once. Only the part the model is sure about counts; a change still
   * being decided keeps the audio from that point waiting, so Gemini's text can be cut at the same place.
   */
  onSeg(end) {
    const u = this.open, seg = this.seg;
    if (!u || u.state !== 'open' || this.splitting || !seg || u.s0 === undefined) { this.suspectAt = 0; return; }
    const c0 = Math.floor(u.s0 / SR / SEG_CELL), cConf = seg.confirmedCell(end), cEnd = Math.floor(end / SR / SEG_CELL);
    const R = seg.runs(c0, cEnd).filter(r => r.l !== 'none');
    const conf = R.filter(r => r.a < cConf).map(r => ({ ...r, b: Math.min(r.b, cConf) }));
    if (!u.segLabel) { const first = conf.find(r => (r.b - r.a) * SEG_CELL >= 0.2); if (first) u.segLabel = first.l; }
    if (!u.segLabel) return;
    const startCell = c0 + Math.round(0.3 / SEG_CELL);
    for (const r of conf) {
      if (r.l === u.segLabel || r.a < startCell) continue;
      const dur = (r.b - r.a) * SEG_CELL, single = !segIsOv(r.l);
      const go = segIsOv(u.segLabel) ? (single ? dur >= SEG_SINGLE : dur >= SEG_OVMIN)
        : (single ? dur >= SEG_SINGLE : dur >= SEG_OVMIN || (!segHas(r.l, u.segLabel) && dur >= SEG_SINGLE));
      if (go && this.cutAt(u, r.a * SEG_CELL * SR, r.l)) return;

    let cut = first.end - W / 2 - H / 2;                    // rough: the first stretch that sounded different was mostly the new voice
    this.splitting = true; this.freezeSince = Date.now();
    this.freezeAt = u.at + Math.round(Math.max(0, cut - 0.7 * SR) / SR * 1000);   // keep that part from being sent while we look closer
    try {

      const c = meanVec(run.map(x => x.emb.vec)), newVec = kind === 'simple' ? c : l2norm(c);

  /** short stretches around the rough change point: which side does each sound like? */
  async findChange(u, around, aVec, bVec, id, kind) {
    // a budget of ~0.6 s of work: fewer, wider steps on a slow device; none at all if one check is already slow
    const cost = SpeakerAI.costMs();
    if (cost > 250) return null;
    const reach = 0.6 * SR, len = (kind === 'simple' ? 0.4 : 0.6) * SR;
    const steps = clamp(Math.floor(600 / Math.max(cost, 8)), 4, kind === 'simple' ? 25 : 9);
    const hop = Math.max((kind === 'simple' ? 0.05 : 0.15) * SR, 2 * reach / (steps - 1));

      const seg = pcm.subarray(a, b);

      const e = await SpeakerAI.embed(seg);
      if (!e || e.engineId !== id) continue;

  splitAt(u, cut, run, newVec) {

  /** the quietest 20 ms frame within ±radius of a sample position (only if it is clearly quieter) */
  quietestNear(u, pos, radius) {

  /* ---------- speaker identification ---------- */
  async identify(u, final) {

    if (u.overlap && this.seg) {

      if (final && u.speaker.type === 'pending') { u.speaker = this.unknownSpeaker(null, false); this.emit('utt', u); }

    }
    const emb = await SpeakerAI.embed(pcm);
    if (u.manual || seq !== u.idSeq) return;
    if (!emb) { if (u.speaker.type === 'pending') { u.speaker = this.unknownSpeaker(null, false); this.emit('utt', u); } return; }

  /**
   * Is it a registered person? Not only "close enough": also clearly closer to them than to anyone else

   *  - close enough and clearly that one person → yes
   *  - close enough, but two registered voices about as close → the timeline (same voice as a moment ago) decides
   *  - a little below the line, but far closer to that person than to anyone else → yes (far from the mic, noise…)

  decideVoice(m, nc, forbid, ts, sec = 0) {

    if (s1 >= thr) {
      if (margin >= K.amb) return { sp: top, score: s1, how: 'voice' };
      const tid = ts && (ts.type === 'self' || ts.type === 'person') ? ts.id : null;
      if (tid && (tid === top.id || (m.second && tid === m.second.id))) { const sp = Speakers.byId(tid); if (sp) return { sp, score: tid === top.id ? s1 : m.secondScore, how: 'voice+track' }; }

  /** voice prints compared with the registered people, and with how they have sounded in this conversation */
  voiceMatch(emb) {

    let changed = false;

      const vecs = ad[id]; if (!vecs || !vecs.length) return [id, v];

      const here = Math.min(sims.reduce((a, b) => a + b, 0) / sims.length - 0.02, v + ((window.__tune && window.__tune.adaptCap) ?? 0.12));

  learnVoice(id, emb) {

  /** tracks of this group were heard side by side with that person: never the same */
  groupApartFrom(c, pid) {

  /**

  promoteClusters() {

    const K = { need: 0.04, needHit: 0.12, margin: 0.10, marginHit: 0.05, ...((window.__tune && window.__tune.promote) || {}) };
    for (const c of s.clusters.slice()) {

      const m = this.voiceMatch({ engineId: c.engineId, vec: c.centroid });

  promoteCluster(c, P, score) {

  /**

   * A new person is only created from a clear, long enough clip; anything in between joins the closest group,
   * and groups that turn out to be the same voice are merged.

  unknownSpeaker(emb, final, voicedSec = 99, forbid = null) {

    const T = SpeakerAI.thresholds(emb.engineId);
    const near = this.nearestCluster(emb, T);

  clusterSim(c, emb) {

  /** how close a clip must be to join this group: loosened when the group's own clips vary a lot (noise, music, shouting) */

  nearestCluster(emb, T = SpeakerAI.thresholds(emb.engineId), exclude = null) {

  addToCluster(c, emb) {

  clustersApart(a, b) {

  /** merge unknown groups whose voices turned out to be the same person */

      for (let i = 0; i < cs.length; i++) for (let j = i + 1; j < cs.length; j++) {

/** display info for a speaker label */
function speakerInfo(sp) {
  if (!sp || sp.type === 'pending') return { name: '判定中', side: 'left', color: 'var(--unknown)', pending: true, initial: '…' };
  if (sp.type === 'self') {
    const s = (sp.id && Speakers.byId(sp.id)) || Speakers.self();

  }
  if (sp.type === 'person') {
    if (sp.demo) return { name: sp.name, side: 'left', color: `var(--sp${sp.color || 1})`, initial: sp.name.slice(0, 1) };
    const s = Speakers.byId(sp.id);
    if (!s) return { name: '削除された話者', side: 'left', color: 'var(--unknown)', initial: '?' };
